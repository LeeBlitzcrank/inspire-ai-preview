<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>D3 手作详情页风格组 · 可操作样机</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  color: #352b24;
  background: #e8e0d4;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
}
.stage { max-width: 1320px; margin: 0 auto; padding: 32px 24px 64px; }
.stage h1 { margin: 0 0 8px; font-size: 25px; }
.sub { margin: 0 0 26px; color: #75685d; font-size: 14px; line-height: 1.8; }
#grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
@media (max-width: 1100px) { #grid { grid-template-columns: 1fr; } }
.option-label { display: flex; align-items: baseline; gap: 10px; margin: 0 0 11px 4px; }
.option-label b { font-size: 17px; }
.option-label span { color: #77695e; font-size: 12.5px; }
.phone {
  padding: 11px;
  border-radius: 31px;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(88,68,45,.15);
  box-shadow: 0 16px 40px rgba(74,54,31,.17);
}
.screen {
  position: relative;
  height: 720px;
  overflow: hidden;
  border-radius: 23px;
  display: flex;
  flex-direction: column;
}
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 18px 9px;
}
.round {
  width: 37px;
  height: 37px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  cursor: pointer;
}
.gallery { flex: 0 0 auto; padding: 0 19px; }
.gallery-main {
  width: 100%;
  height: 215px;
  display: block;
  object-fit: cover;
  border-radius: 17px;
}
.thumbs { display: flex; gap: 8px; margin-top: 9px; overflow-x: auto; padding-bottom: 2px; }
.thumb-item {
  width: 49px;
  height: 49px;
  flex: 0 0 auto;
  object-fit: cover;
  border-radius: 12px;
  border: 2px dashed transparent;
  cursor: pointer;
  opacity: .62;
}
.thumb-item.active { opacity: 1; border-style: solid; }
.image-count { margin-top: 7px; font-size: 11.5px; opacity: .72; }
.article { flex: 1; min-height: 0; overflow-y: auto; padding: 19px 23px 92px; }
.kicker {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 3px 11px;
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 1px;
  margin-bottom: 10px;
  transform: rotate(-1.5deg);
}
h2 { margin: 0 0 12px; font-size: 26px; line-height: 1.36; }
.lead { margin: 0 0 15px; font-size: 14px; line-height: 1.9; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 17px; }
.tag {
  display: inline-flex;
  align-items: center;
  min-height: 29px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  transform: rotate(-1deg);
}
.author {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px;
  border-radius: 18px;
  border: 2px dashed currentColor;
}
.author-avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
}
.author b { display: block; margin-bottom: 2px; font-size: 14px; }
.author small { font-size: 12px; }
.follow { margin-left: auto; padding: 7px 14px; border-radius: 999px; font-size: 12.5px; cursor: pointer; }
.comments-title { margin: 23px 0 0; font-size: 15px; font-weight: 700; }
.comment-list { margin-top: 2px; }
.comment { padding: 13px 0; border-top: 1.5px dashed currentColor; }
.comment-head {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 9px;
  margin-bottom: 7px;
  text-align: left;
}
.comment-avatar {
  width: 31px;
  height: 31px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
}
.comment-head b {
  font-size: 13.5px;
  text-align: left;
}
.comment-head > span:last-child { margin-left: auto; font-size: 12px; opacity: .68; }
.comment-head .comment-avatar { margin-left: 0; opacity: 1; }
.comment-text { margin: 0; font-size: 13.7px; line-height: 1.68; }
.comment-tools { display: flex; gap: 15px; align-items: center; margin-top: 8px; font-size: 12px; opacity: .78; }
.comment-tools span { cursor: pointer; }
.comment-like.liked { opacity: 1; font-weight: 700; }
.bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  height: 72px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 16px;
}
.fake {
  flex: 1;
  height: 42px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  border-radius: 999px;
  font-size: 13.5px;
}
.quick-comment {
  padding: 0;
  overflow: hidden;
}
.quick-comment input {
  width: 100%;
  height: 100%;
  border: 0;
  outline: 0;
  padding: 0 15px;
  background: transparent;
  color: inherit;
  font-family: inherit;
  font-size: 13.5px;
}
.actions { display: flex; gap: 11px; }
.action {
  min-width: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  font-size: 11px;
  cursor: pointer;
}
.comment-root .comment-tools { margin-bottom: 0; }
.replies {
  margin: 10px 0 0 22px;
  padding: 9px 12px;
  border-radius: 15px;
  border-left: 3px solid currentColor;
  background: rgba(255,255,255,.38);
}
.reply { padding: 9px 0; border-top: 1px dotted currentColor; }
.reply:first-child { padding-top: 0; border-top: none; }
.reply .comment-head span { font-size: 11.5px; }
.reply-to { font-weight: 700; }
.reply-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  font-size: 12px;
}
.reply-toggle,
.reply-more,
.reply-collapse {
  color: inherit;
  font-weight: 700;
  cursor: pointer;
}
.reply-collapse {
  opacity: .62;
  font-weight: 400;
}
.replies.empty {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
}
.reply-box {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}
.reply-box[hidden] { display: none; }
.reply-box input {
  flex: 1;
  height: 35px;
  padding: 0 11px;
  border-radius: 10px;
  border: 1.5px solid currentColor;
  outline: none;
  background: transparent;
  color: inherit;
  font-family: inherit;
  font-size: 12.5px;
}
.reply-box button {
  border: none;
  padding: 0 12px;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
}
.reply-box button:disabled { opacity: .38; }
.comment-load-status {
  margin: 15px 0 4px;
  text-align: center;
  font-size: 12.5px;
  opacity: .72;
}

const state = {}

function img(id, width = 640) {
  const height = width === 640 ? 420 : 120
  return `https://picsum.photos/id/${id}/${width}/${height}`
}

function renderVariant(variant) {
  const section = document.createElement('section')
  section.dataset.variant = variant.id
  section.innerHTML = `
    <div class="option-label"><b>${variant.name}</b><span>${variant.note}</span></div>
    <div class="phone">
      <div class="screen ${variant.id}">
        <div class="topbar">
          <div class="round">‹</div>
          <div class="round">···</div>
        </div>
        <div class="gallery">
          <img class="gallery-main" src="${img(variant.images[0])}" alt="灵感主图">
          <div class="thumbs"></div>
          <div class="image-count">1/${variant.images.length} · 点击缩略图切换</div>
        </div>
        <div class="article">
          <div class="kicker">${variant.kicker}</div>
          <h2>${variant.title}</h2>
          <p class="lead">${variant.lead}</p>
          <div class="tags">
            ${variant.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
          </div>
          <div class="author">
            <div class="author-avatar">${variant.author.mark}</div>
            <div>
              <b>${variant.author.name}</b>
              <small>发布于 2 小时前 · ${variant.city}</small>
            </div>
            <span class="follow">关注</span>
          </div>
          <div class="comments-title">
            共 <span class="comment-total"></span> 条主评论 ·

          </div>
          <div class="comment-list"></div>
          <div class="comment-load-status"></div>
        </div>
        <div class="bottom">
          <form class="fake quick-comment quick-root-comment">
            <input placeholder="说点什么..." maxlength="200" aria-label="快速评论">
          </form>
          <div class="actions">
            <div class="action like-main ${variant.liked ? 'liked' : ''}">♡<span>${variant.likes}</span></div>
            <div class="action">☆<span>${variant.collects}</span></div>
          </div>
        </div>
      </div>
    </div>`
  document.getElementById('grid').appendChild(section)
}

function initGallery(variant, section) {
  const main = section.querySelector('.gallery-main')
  const thumbs = section.querySelector('.thumbs')
  const count = section.querySelector('.image-count')
  variant.images.forEach((id, index) => {
    const item = document.createElement('img')
    item.className = `thumb-item${index === 0 ? ' active' : ''}`
    item.src = img(id, 120)
    item.alt = `图片 ${index + 1}`
    item.addEventListener('click', () => {
      main.src = img(id)
      count.textContent = `${index + 1}/${variant.images.length} · 点击缩略图切换`
      thumbs.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'))
      item.classList.add('active')
    })
    thumbs.appendChild(item)
  })
}

function escapeHTML(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;')
}

      replies: [
        { id: 's1-r3-a1', avatarMark: '莓', name: '莓果午后', replyTo: '麦穗午后', text: '橘子司康听起来好好吃，记得补一张切开的图。', likes: 4, liked: false, time: '29 分钟前' },

    '这一页给人的感觉很明亮，像周末上午的阳光。'
  ]
  const replyTexts = [
    '我也这么觉得，这个颜色真的很适合记录甜点。',
    '回复你一下，正式版应该会保留这些小贴纸。',

  for (let i = roots.length; i < 72; i++) {
    const author = people[i % people.length]
    const friend = people[(i + 3) % people.length]
    const third = people[(i + 6) % people.length]

  return roots
}

function makeSimpleRoots(variant) {
  return variant.comments.map(([avatarMark, name, text], index) => ({
    id: `${variant.id}-r${index + 1}`,
    avatarMark,
    name,
    text,
    likes: index + 2,
    liked: index === 0,
    time: `${index + 3} 分钟前`,
    replies: []
  }))
}

function findComment(id, rootId, replyId) {
  const root = state[id].comments.find(item => item.id === rootId)
  if (!root) return null
  return replyId ? root.replies.find(item => item.id === replyId) : root
}

function renderReply(item, rootId) {
  const reply = document.createElement('div')
  reply.className = 'comment reply'
  reply.dataset.replyId = item.id
  reply.innerHTML = `
    <div class="comment-head">
      <span class="comment-avatar">${escapeHTML(item.avatarMark)}</span>
      <b>${escapeHTML(item.name)}</b>
      <span>${escapeHTML(item.time)}</span>
    </div>
    <p class="comment-text"><span class="reply-to">@${escapeHTML(item.replyTo)}</span> ${escapeHTML(item.text)}</p>
    <div class="comment-tools">
      <span class="comment-like ${item.liked ? 'liked' : ''}" data-root-id="${rootId}" data-reply-id="${item.id}">${item.liked ? '已赞' : '赞'} ${item.likes}</span>
      <span class="comment-reply" data-root-id="${rootId}" data-reply-id="${item.id}">回复</span>
    </div>`
  return reply
}

function renderRoot(root) {
  const replyList = root.replies || []
  const expanded = Boolean(root.repliesExpanded)
  const visibleReplyCount = expanded
    ? Math.min(root.visibleReplyCount || 3, replyList.length)
    : Math.min(1, replyList.length)
  const visibleReplies = replyList.slice(0, visibleReplyCount)
  const hasMoreReplies = visibleReplyCount < replyList.length
  const repliesClass = replyList.length ? '' : ' empty'
  const replyControl = replyList.length <= 1
    ? ''
    : !expanded
      ? `<div class="reply-actions"><span class="reply-toggle" data-root-id="${root.id}">查看全部 ${replyList.length} 条回复</span></div>`
      : hasMoreReplies
        ? `<div class="reply-actions"><span class="reply-more" data-root-id="${root.id}">继续显示回复 ${visibleReplyCount}/${replyList.length}</span><span class="reply-collapse" data-root-id="${root.id}">收起</span></div>`
        : `<div class="reply-actions"><span class="reply-collapse" data-root-id="${root.id}">收起回复</span></div>`

  const comment = document.createElement('div')
  comment.className = 'comment comment-root'
  comment.dataset.rootId = root.id
  comment.innerHTML = `
    <div class="comment-head">
      <span class="comment-avatar">${escapeHTML(root.avatarMark)}</span>
      <b>${escapeHTML(root.name)}</b>
      <span>${escapeHTML(root.time)}</span>
    </div>
    <p class="comment-text">${escapeHTML(root.text)}</p>
    <div class="comment-tools">
      <span class="comment-like ${root.liked ? 'liked' : ''}" data-root-id="${root.id}">${root.liked ? '已赞' : '赞'} ${root.likes}</span>
      <span class="comment-reply" data-root-id="${root.id}">回复</span>
    </div>
    <div class="replies${repliesClass}">
      ${visibleReplies.map(item => `<div class="comment reply" data-reply-id="${item.id}">
        <div class="comment-head"><span class="comment-avatar">${escapeHTML(item.avatarMark)}</span><b>${escapeHTML(item.name)}</b><span>${escapeHTML(item.time)}</span></div>
        <p class="comment-text"><span class="reply-to">@${escapeHTML(item.replyTo)}</span> ${escapeHTML(item.text)}</p>
        <div class="comment-tools">
          <span class="comment-like ${item.liked ? 'liked' : ''}" data-root-id="${root.id}" data-reply-id="${item.id}">${item.liked ? '已赞' : '赞'} ${item.likes}</span>
          <span class="comment-reply" data-root-id="${root.id}" data-reply-id="${item.id}">回复</span>
        </div>
      </div>`).join('')}
      ${replyControl}
      <form class="reply-box" data-root-id="${root.id}" hidden>
        <input placeholder="回复..." maxlength="200">
        <button type="button" disabled>发送</button>
      </form>
    </div>`
  return comment
}

function renderComments(id, section) {
  const commentState = state[id]
  const list = section.querySelector('.comment-list')
  list.innerHTML = ''
  commentState.comments
    .slice(0, commentState.displayedCount)
    .forEach(root => list.appendChild(renderRoot(root)))

  const total = commentState.comments.length
  const shown = Math.min(commentState.displayedCount, total)
  section.querySelector('.comment-total').textContent = total
  section.querySelector('.comment-total-copy').textContent = total
  section.querySelector('.comment-shown').textContent = shown
  section.querySelector('.comment-load-status').textContent = shown < total
    ? `下滑加载 20 条 · 当前显示 ${shown}/${total}`
    : `已显示全部 ${total} 条主评论`
}

function initState(variant, section) {
  state[variant.id] = {
    comments: variant.id === 'a' ? makeRichS1Comments() : makeSimpleRoots(variant),
    displayedCount: 20
  }
  renderComments(variant.id, section)
}

variants.forEach(variant => {
  renderVariant(variant)
  const section = document.querySelector(`[data-variant="${variant.id}"]`)
  initGallery(variant, section)
  initState(variant, section)
})

document.addEventListener('scroll', event => {
  const article = event.target.classList && event.target.classList.contains('article')
    ? event.target
    : null
  if (!article) return
  const section = article.closest('section')
  const commentState = state[section.dataset.variant]
  const nearBottom = article.scrollTop + article.clientHeight >= article.scrollHeight - 28
  if (!nearBottom || commentState.displayedCount >= commentState.comments.length) return
  commentState.displayedCount = Math.min(
    commentState.displayedCount + 20,
    commentState.comments.length
  )
  renderComments(section.dataset.variant, section)
}, true)

document.addEventListener('input', event => {
  const replyBox = event.target.closest('.reply-box')
  if (replyBox) {
    replyBox.querySelector('button').disabled = !event.target.value.trim()
  }
})

document.addEventListener('keydown', event => {
  const input = event.target.closest('.quick-root-comment input')
  if (!input || event.key !== 'Enter' || event.isComposing) return
  const text = input.value.trim()
  if (!text) return
  event.preventDefault()

  const section = input.closest('section')
  const id = section.dataset.variant
  state[id].comments.unshift({
    id: `${id}-new-${Date.now()}`,
    avatarMark: '我',
    name: '当前用户',
    text,
    likes: 0,
    liked: false,
    time: '刚刚',
    replies: []
  })
  input.value = ''
  renderComments(id, section)
  const article = section.querySelector('.article')
  const title = section.querySelector('.comments-title')
  const targetTop = title.getBoundingClientRect().top
    - article.getBoundingClientRect().top
    + article.scrollTop
    - 12
  article.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' })
})

document.addEventListener('click', event => {
  const mainLike = event.target.closest('.like-main')
  if (mainLike) {
    const active = mainLike.classList.toggle('liked')
    const count = mainLike.querySelector('span')
    count.textContent = Number(count.textContent) + (active ? 1 : -1)
  }

  const replyControl = event.target.closest('.reply-toggle, .reply-more, .reply-collapse')
  if (replyControl) {
    const section = replyControl.closest('section')
    const id = section.dataset.variant
    const root = state[id].comments.find(item => item.id === replyControl.dataset.rootId)
    if (!root) return
    if (replyControl.classList.contains('reply-toggle')) {
      root.repliesExpanded = true
      root.visibleReplyCount = Math.min(3, root.replies.length)
    } else if (replyControl.classList.contains('reply-more')) {
      root.repliesExpanded = true
      root.visibleReplyCount = Math.min(
        (root.visibleReplyCount || 3) + 3,
        root.replies.length
      )
    } else {
      root.repliesExpanded = false
      root.visibleReplyCount = 1
    }
    renderComments(id, section)
    return
  }

  const like = event.target.closest('.comment-like')
  if (like) {
    const section = like.closest('section')
    const id = section.dataset.variant
    const item = findComment(id, like.dataset.rootId, like.dataset.replyId)
    if (!item) return
    item.liked = !item.liked
    item.likes += item.liked ? 1 : -1
    like.textContent = `${item.liked ? '已赞' : '赞'} ${item.likes}`
    like.classList.toggle('liked', item.liked)
  }

  const replyTrigger = event.target.closest('.comment-reply')
  if (replyTrigger) {
    const section = replyTrigger.closest('section')
    const rootId = replyTrigger.dataset.rootId
    const targetItem = findComment(section.dataset.variant, rootId, replyTrigger.dataset.replyId)
    const rootElement = section.querySelector(`[data-root-id="${rootId}"]`)
    section.querySelectorAll('.reply-box').forEach(box => {
      if (box.dataset.rootId !== rootId) box.hidden = true
    })
    const replyBox = rootElement.querySelector('.reply-box')
    replyBox.hidden = false
    replyBox.dataset.replyToId = replyTrigger.dataset.replyId || rootId
    const input = replyBox.querySelector('input')
    input.placeholder = targetItem ? `回复 @${targetItem.name}` : '回复...'
    input.value = ''
    replyBox.querySelector('button').disabled = true
    input.focus()
  }
})

document.addEventListener('click', event => {
  const replyButton = event.target.closest('.reply-box button')
  if (replyButton && !replyButton.disabled) {
    const section = replyButton.closest('section')
    const id = section.dataset.variant
    const replyBox = replyButton.closest('.reply-box')
    const rootId = replyBox.dataset.rootId
    const root = state[id].comments.find(item => item.id === rootId)
    const target = findComment(id, rootId, replyBox.dataset.replyToId !== rootId
      ? replyBox.dataset.replyToId
      : null)
    const input = replyBox.querySelector('input')
    root.replies.push({
      id: `${rootId}-new-${Date.now()}`,
      avatarMark: '我',
      name: '当前用户',
      replyTo: target ? target.name : root.name,
      text: input.value.trim(),
      likes: 0,
      liked: false,
      time: '刚刚'
    })
    root.repliesExpanded = true
    root.visibleReplyCount = root.replies.length
    replyBox.hidden = true
    renderComments(id, section)
  }
})
