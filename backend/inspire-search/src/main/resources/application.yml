#
# 文件：backend/inspire-search/src/main/resources/application.yml
# 所属模块：搜索服务模块，负责 MySQL/Elasticsearch 搜索及降级
# 主要职责：YAML 配置，定义服务、运行参数或自动化流程
# 维护说明：注释解释文件边界和核心意图，具体业务规则以方法、组件和主文档说明为准。
# INSPIRE_FILE_HEADER
server:
  port: 8086

management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

spring:
  application:
    name: inspire-search
  profiles:
    active: dev
inspire:
  search:
    mode: auto
logging:
  level:
    com.inspire: ${INSPIRE_LOG_LEVEL:info}
