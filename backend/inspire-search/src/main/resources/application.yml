server:
  port: 8086

management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

spring:
  application:
    name: inspire-search
  profiles:
    active: dev
inspire:
  search:
    mode: auto
logging:
  level:
    com.inspire: ${INSPIRE_LOG_LEVEL:info}
