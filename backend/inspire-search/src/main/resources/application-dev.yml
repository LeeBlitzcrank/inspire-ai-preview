#
# 文件：backend/inspire-search/src/main/resources/application-dev.yml
# 所属模块：搜索服务模块，负责 MySQL/Elasticsearch 搜索及降级
# 主要职责：YAML 配置，定义服务、运行参数或自动化流程
# 维护说明：注释解释文件边界和核心意图，具体业务规则以方法、组件和主文档说明为准。
# INSPIRE_FILE_HEADER
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inspire_ai_preview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionTimeZone=%2B08:00&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: ${INSPIRE_SEARCH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
inspire:
  search:
    mode: auto
  es:
    hosts: localhost:9200
logging:
  level:
    com.inspire: ${INSPIRE_LOG_LEVEL:info}
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSS Asia/Shanghai
