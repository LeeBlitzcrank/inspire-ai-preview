#
# 文件：backend/inspire-ai/src/main/resources/application.yml
# 所属模块：AI 服务模块，负责创作生成、AI 探索和世界种子
# 主要职责：YAML 配置，定义服务、运行参数或自动化流程
# 维护说明：注释解释文件边界和核心意图，具体业务规则以方法、组件和主文档说明为准。
# INSPIRE_FILE_HEADER
server:
  port: 8082

management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

spring:
  application:
    name: inspire-ai
  profiles:
    active: dev
inspire:
  ai:
    deepseek:
      api-key: ${INSPIRE_DEEPSEEK_API_KEY:}
      api-url: ${INSPIRE_DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
      model: deepseek-chat
    world:
      recovery-initial-delay-ms: ${INSPIRE_WORLD_RECOVERY_INITIAL_DELAY_MS:15000}
      recovery-delay-ms: ${INSPIRE_WORLD_RECOVERY_DELAY_MS:30000}
logging:
  level:
    com.inspire: debug

redis:
  host: ${INSPIRE_REDIS_HOST:localhost}
  port: ${INSPIRE_REDIS_PORT:6379}
  password: ${INSPIRE_REDIS_PASSWORD}
