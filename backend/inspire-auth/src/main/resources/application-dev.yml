#
# 文件：backend/inspire-auth/src/main/resources/application-dev.yml
# 所属模块：用户认证模块，负责登录、令牌、会话、密码和登录风控
# 主要职责：YAML 配置，定义服务、运行参数或自动化流程
# 维护说明：注释解释文件边界和核心意图，具体业务规则以方法、组件和主文档说明为准。
# INSPIRE_FILE_HEADER
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inspire_ai_preview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionTimeZone=%2B08:00&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: ${INSPIRE_AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000

  data:
    redis:
      host: ${INSPIRE_REDIS_HOST:localhost}
      port: ${INSPIRE_REDIS_PORT:6379}
      password: ${INSPIRE_REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

logging:
  level:
    com.inspire: debug
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSS Asia/Shanghai
