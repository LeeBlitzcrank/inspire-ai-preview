#
# 文件：backend/inspire-auth/src/main/resources/application.yml
# 所属模块：用户认证模块，负责登录、令牌、会话、密码和登录风控
# 主要职责：YAML 配置，定义服务、运行参数或自动化流程
# 维护说明：注释解释文件边界和核心意图，具体业务规则以方法、组件和主文档说明为准。
# INSPIRE_FILE_HEADER
server:
  port: 8081

management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

spring:
  application:
    name: inspire-auth
  profiles:
    active: dev
  data:
    redis:
      host: ${INSPIRE_REDIS_HOST:localhost}
      port: ${INSPIRE_REDIS_PORT:6379}
      password: ${INSPIRE_REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # SQL 初始化
  sql:
    init:
      mode: never

  # 邮件配置（找回密码用）
  mail:
    host: smtp.qq.com
    port: 587
    username: ${INSPIRE_MAIL_USERNAME:}
    # 文档5.2节：QQ邮箱SMTP授权码，非邮箱密码，非数据库密码
    password: ${INSPIRE_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

mybatis-plus:
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

inspire:
  jwt:
    # JWT密钥：通过环境变量INSPIRE_JWT_SECRET注入（文档5.1节），开发环境有默认值
    secret: ${INSPIRE_JWT_SECRET}
    # AccessToken 有效期（文档4.1.2节）：15分钟 = 900秒
    access-token-expiration: 900000
  session:
    # RefreshToken 有效期（文档4.1.2节）：7天
    refresh-token-expiration: 604800000
  sms:
    webhook-url: ${INSPIRE_SMS_WEBHOOK_URL:}
    webhook-token: ${INSPIRE_SMS_WEBHOOK_TOKEN:}
    code-expire-seconds: 300
    cooldown-seconds: 60
    daily-limit: 10
    max-attempts: 5
    dev-return-code: false
    log-code: false
  app:
    frontend-url: ${INSPIRE_APP_FRONTEND_URL:http://localhost:5173}

logging:
  level:
    com.inspire: debug
    com.baomidou.mybatisplus: info

# RocketMQ 配置
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
