server:
  port: 8087

spring:
  application:
    name: inspire-rag
  profiles:
    active: dev
  elasticsearch:
    uris: http://${INSPIRE_ES_HOSTS:localhost:9200}
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}

inspire:
  rag:
    enabled: ${INSPIRE_RAG_ENABLED:true}
    index-name: ${INSPIRE_RAG_INDEX_NAME:inspire_rag_index}
    embedding-dims: ${INSPIRE_RAG_EMBEDDING_DIMS:768}
    embedding-batch-size: ${INSPIRE_RAG_EMBEDDING_BATCH_SIZE:32}
    default-top-k: ${INSPIRE_RAG_DEFAULT_TOP_K:8}
    candidate-k: ${INSPIRE_RAG_CANDIDATE_K:30}
    sync-batch-size: ${INSPIRE_RAG_SYNC_BATCH_SIZE:50}
    sync-delay-ms: ${INSPIRE_RAG_SYNC_DELAY_MS:30000}
    elasticsearch-host: ${INSPIRE_ES_HOSTS:localhost:9200}
    core-base-url: ${INSPIRE_RAG_CORE_BASE_URL:http://localhost:8083}
    image-base-url: ${INSPIRE_RAG_IMAGE_BASE_URL:https://img.20sherry.com}
    admin-token: ${INSPIRE_RAG_ADMIN_TOKEN:}
    image-analysis-enabled: ${INSPIRE_RAG_IMAGE_ANALYSIS_ENABLED:true}
    ollama-embedding-enabled: ${INSPIRE_RAG_OLLAMA_EMBEDDING_ENABLED:false}
    ollama-caption-enabled: ${INSPIRE_RAG_OLLAMA_CAPTION_ENABLED:false}
    ollama-url: ${INSPIRE_RAG_OLLAMA_URL:http://localhost:11434}
    embedding-model: ${INSPIRE_RAG_EMBEDDING_MODEL:embeddinggemma:300m}
    caption-model: ${INSPIRE_RAG_CAPTION_MODEL:qwen2.5vl:7b}
    deepseek-api-key: ${INSPIRE_DEEPSEEK_API_KEY:}
    deepseek-api-url: ${INSPIRE_DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
    deepseek-model: ${INSPIRE_RAG_ANSWER_MODEL:deepseek-chat}

logging:
  level:
    com.inspire: ${INSPIRE_LOG_LEVEL:info}
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSS Asia/Shanghai
