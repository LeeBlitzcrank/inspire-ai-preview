#
# 文件：backend/inspire-admin/src/main/resources/application.yml
# 所属模块：后台管理模块，负责管理员鉴权、内容审核和运营配置
# 主要职责：YAML 配置，定义服务、运行参数或自动化流程
# 维护说明：注释解释文件边界和核心意图，具体业务规则以方法、组件和主文档说明为准。
# INSPIRE_FILE_HEADER
server:
  port: 8085

management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

spring:
  application:
    name: inspire-admin
  profiles:
    active: dev
  sql:
    init:
      mode: never
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
inspire:
  jwt:
    secret: ${INSPIRE_ADMIN_JWT_SECRET}
    expiration: ${INSPIRE_ADMIN_JWT_EXPIRATION:315360000000}
logging:
  level:
    com.inspire: debug
