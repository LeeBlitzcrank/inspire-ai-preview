#
# 文件：backend/inspire-core/src/main/resources/application.yml
# 所属模块：核心业务模块，负责灵感、评论、收藏、消息、系列、文件和通知
# 主要职责：YAML 配置，定义服务、运行参数或自动化流程
# 维护说明：注释解释文件边界和核心意图，具体业务规则以方法、组件和主文档说明为准。
# INSPIRE_FILE_HEADER
server:
  port: 8083

management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

spring:
  application:
    name: inspire-core
  profiles:
    active: dev
  elasticsearch:
    uris: http://${INSPIRE_ES_HOSTS:localhost:9200}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # 图片 5MB / 视频 50MB，这里放宽到 100MB：超过业务限制时由业务层返回友好提示，
      # 而不是让 Tomcat 直接断开连接（浏览器会显示 ERR_CONNECTION_RESET）
      max-file-size: 100MB
      max-request-size: 120MB
      # 超过限制时不要直接断开连接，否则浏览器会看到 ERR_CONNECTION_RESET
      resolve-lazily: true
  web:
    resources:
      cache:
        period: 86400
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history_core
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
mybatis-plus:
  global-config:
    db-config:
      id-type: none
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
logging:
  level:
    com.inspire: ${INSPIRE_LOG_LEVEL:info}
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
inspire:
  recommend:
    vector-index: ${INSPIRE_RECOMMEND_VECTOR_INDEX:inspire_recommend_vector}
    embedding-dims: ${INSPIRE_RAG_EMBEDDING_DIMS:768}
    redis-profile-ttl-seconds: ${INSPIRE_RECOMMEND_PROFILE_TTL_SECONDS:604800}
    redis-vector-ttl-seconds: ${INSPIRE_RECOMMEND_VECTOR_TTL_SECONDS:1800}
    experiment-id: ${INSPIRE_RECOMMEND_EXPERIMENT_ID:recommend_v2}
    experiment-enabled: ${INSPIRE_RECOMMEND_EXPERIMENT_ENABLED:true}
    experiment-treatment-percent: ${INSPIRE_RECOMMEND_TREATMENT_PERCENT:50}
  upload:
    dir: /tmp/inspire-uploads
  redis:
    ttl-seconds: 30
  image:
    cdn-domain: ${INSPIRE_CDN_DOMAIN:https://img.20sherry.com}
  minio:
    endpoint: ${INSPIRE_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${INSPIRE_MINIO_ACCESS_KEY}
    secret-key: ${INSPIRE_MINIO_SECRET_KEY}
    bucket: ${INSPIRE_MINIO_BUCKET:inspire-img}
