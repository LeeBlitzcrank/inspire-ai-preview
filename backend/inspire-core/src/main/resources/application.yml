server:
  port: 8083
spring:
  application:
    name: inspire-core
  profiles:
    active: dev
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # 图片 5MB / 视频 50MB，这里放宽到 100MB：超过业务限制时由业务层返回友好提示，
      # 而不是让 Tomcat 直接断开连接（浏览器会显示 ERR_CONNECTION_RESET）
      max-file-size: 100MB
      max-request-size: 120MB
      # 超过限制时不要直接断开连接，否则浏览器会看到 ERR_CONNECTION_RESET
      resolve-lazily: true
  web:
    resources:
      cache:
        period: 86400
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
mybatis-plus:
  global-config:
    db-config:
      id-type: none
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com.inspire: debug
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
inspire:
  upload:
    dir: /tmp/inspire-uploads
  redis:
    ttl-seconds: 30
  image:
    cdn-domain: ${INSPIRE_CDN_DOMAIN:https://img.20sherry.com}
  minio:
    endpoint: ${INSPIRE_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${INSPIRE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${INSPIRE_MINIO_SECRET_KEY:minioadmin123}
    bucket: ${INSPIRE_MINIO_BUCKET:inspire-img}
