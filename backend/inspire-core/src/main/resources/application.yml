server:
  port: 8083
spring:
  application:
    name: inspire-core
  profiles:
    active: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      cache:
        period: 86400
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
mybatis-plus:
  global-config:
    db-config:
      id-type: none
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com.inspire: debug
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
inspire:
  upload:
    dir: /tmp/inspire-uploads
  redis:
    ttl-seconds: 30
  image:
    cdn-domain: ${INSPIRE_CDN_DOMAIN:https://img.20sherry.com}
  minio:
    endpoint: ${INSPIRE_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${INSPIRE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${INSPIRE_MINIO_SECRET_KEY:minioadmin123}
    bucket: ${INSPIRE_MINIO_BUCKET:inspire-img}
