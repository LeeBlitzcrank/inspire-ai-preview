<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人页 v2 · 可点击预览（功能对齐版）</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:20px 14px 60px;background:#eef4f2;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:460px;margin:0 auto}
  .phone{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(20,70,60,.10);position:relative}
  .tag-new,.tag-keep,.tag-chg{font-size:10px;padding:1px 6px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .tag-keep{background:#eef7f0;color:#3f7f52}
  .tag-chg{background:#fff4e5;color:#b26a00}
  .tag-new{background:#eaf1ff;color:#3a63b8}

  .topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #eef4f2;position:relative}
  .logo{font-size:20px;cursor:pointer;line-height:1}
  .navs{display:flex;gap:14px;font-size:17px}
  .navs span{cursor:pointer;transition:.15s}
  .navs span:hover{transform:translateY(-1px)}
  .ttl{font-size:15px;font-weight:700;position:absolute;left:0;right:0;text-align:center;pointer-events:none}

  .profile{padding:16px;background:linear-gradient(180deg,#f4fbf9,#fff)}
  .p-top{display:flex;align-items:center;gap:12px}
  .avatar{width:60px;height:60px;border-radius:50%;flex:0 0 auto;background:#e6f2e4;color:#4f8a48;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
  .p-name{font-size:16.5px;font-weight:700;margin-bottom:3px}
  .p-acct{font-size:12.5px;color:#8a94a6}
  .p-ops{margin-left:auto;display:flex;flex-direction:column;gap:6px}
  .p-ops button{padding:6px 12px;border-radius:999px;border:1px solid #cfe6e0;background:#fff;color:#0f766e;font-size:12px;cursor:pointer;white-space:nowrap}
  .stats{display:flex;margin-top:14px}
  .stat{flex:1;text-align:center}
  .stat b{display:block;font-size:16px;color:#0f766e}
  .stat span{font-size:11.5px;color:#9aa3b2}

  .tabs{display:flex;gap:6px;margin:0 16px 12px;padding:4px;background:#e9f5f2;border-radius:12px}
  .tabs button{flex:1;padding:9px 0;border:none;border-radius:9px;background:transparent;font-family:inherit;font-size:13px;color:#5f807a;cursor:pointer}
  .tabs button.on{background:#fff;color:#0f766e;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .tabs .cnt{font-size:11px;color:#9bb5b0}
  .tabs button.on .cnt{color:#0f766e}

  .body{padding:0 16px 14px;min-height:420px}
  .virt{height:340px;overflow-y:auto;padding-right:2px}
  .spacer{position:relative}
  .card{position:absolute;left:0;right:0;height:76px;padding:11px 12px;margin-bottom:8px;background:#fff;border:1px solid #e6f2ef;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:11px}
  .card:hover{border-color:#a8dcd2;box-shadow:0 4px 14px rgba(30,90,80,.08)}
  .thumb{width:54px;height:54px;border-radius:11px;flex:0 0 auto}
  .txt{min-width:0}
  .t{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .m{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#9aa3b2}
  .tag{font-size:11px;padding:1px 7px;border-radius:999px;background:#f1f7f5;color:#4b7a72}
  .loading{text-align:center;padding:11px 0;font-size:12px;color:#9aa3b2}
  .bar{height:4px;border-radius:99px;background:#eef4f2;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:#0f766e}

  .draft{padding:12px 13px;margin-bottom:9px;background:#fff;border:1px solid #e6f2ef;border-radius:14px;cursor:pointer}
  .draft .dt{font-size:13.5px;font-weight:600;margin-bottom:6px}
  .draft .dm{font-size:11.5px;color:#9aa3b2}

  .fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  .folder{padding:14px 12px;background:#fff;border:1px solid #e6f2ef;border-radius:15px;cursor:pointer;display:flex;align-items:center;gap:10px}
  .folder:hover{border-color:#a8dcd2;box-shadow:0 4px 14px rgba(30,90,80,.08)}
  .folder .ico{width:38px;height:38px;border-radius:11px;background:#f1f7f5;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .folder .fn{font-size:13px;font-weight:600;margin-bottom:2px}
  .folder .fc{font-size:11px;color:#9aa3b2}
  .folder.add{border-style:dashed;justify-content:center;color:#0f766e;font-size:13px}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .back{background:none;border:none;color:#0f766e;font-size:13px;cursor:pointer;padding:0}
  .urow{display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:9px;background:#fff;border:1px solid #e6f2ef;border-radius:14px}
  .uav{width:44px;height:44px;border-radius:50%;background:#e6f2e4;color:#4f8a48;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
  .un{font-size:13.5px;font-weight:600;margin-bottom:3px}
  .ua{font-size:11.5px;color:#9aa3b2}
  .uops{margin-left:auto;display:flex;gap:7px}
  .uops button{font-size:11.5px;padding:6px 11px;border-radius:999px;border:1px solid #e3ecea;background:#fff;color:#0f766e;cursor:pointer;font-family:inherit}
  .uops button.unfollow{color:#9aa3b2}

  .logout{display:block;width:calc(100% - 32px);margin:0 16px 18px;height:40px;border-radius:12px;border:1px solid #f0dcd3;background:#fff;color:#c2613a;font-family:inherit;font-size:13.5px;cursor:pointer}

  /* 弹窗 */
  .mask{position:absolute;inset:0;background:rgba(20,40,36,.35);display:none;align-items:center;justify-content:center;padding:18px}
  .mask.on{display:flex}
  .dialog{width:100%;max-width:330px;background:#fff;border-radius:16px;padding:16px;max-height:82%;overflow-y:auto}
  .dialog h3{margin:0 0 12px;font-size:15px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12.5px;color:#5b6b68;margin-bottom:6px}
  .fld input{width:100%;height:38px;padding:0 12px;border:1px solid #e3ecea;border-radius:10px;font-family:inherit;font-size:13px}
  .dice{width:38px;height:38px;border:1px solid #e3ecea;border-radius:10px;background:#fff;cursor:pointer;font-size:16px}
  .avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:150px;overflow-y:auto;padding:2px}
  .avatars span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#f4f9f7;font-size:16px;cursor:pointer;border:2px solid transparent}
  .avatars span.sel{border-color:#0f766e;background:#e9f5f2}
  .dlg-ops{display:flex;gap:8px;margin-top:6px}
  .dlg-ops button{flex:1;height:40px;border-radius:11px;border:none;font-family:inherit;font-size:13.5px;cursor:pointer}
  .dlg-ops .ghost{background:#f2f6f5;color:#5b6b68}
  .dlg-ops .main{background:#0f766e;color:#fff}
  .tip{margin-top:12px;font-size:12px;color:#8a94a6;line-height:1.75}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="topbar">
      <span class="logo" title="返回首页" onclick="toast('返回首页')">🍎</span>
      <div class="ttl" id="ttl">个人中心</div>
      <div class="navs">
        <span title="创建灵感" onclick="toast('去创建灵感')">✨</span>
        <span title="查询" onclick="toast('去搜索')">🔍</span>
      </div>
    </div>

    <div class="profile" id="profile">
      <div class="p-top">
        <div class="avatar" id="avatarBox">甜</div>
        <div>
          <div class="p-name" id="nickBox">甜蜜小鹿</div>
          <div class="p-acct">@admin</div>
        </div>
        <div class="p-ops">
          <button onclick="openProfile()">编辑资料<span class="tag-keep">保留</span></button>
          <button onclick="openPwd()">修改密码<span class="tag-keep">保留</span></button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b>386</b><span>灵感</span></div>
        <div class="stat" style="cursor:pointer" onclick="openFollowing()"><b>12</b><span>关注 ›</span></div>
        <div class="stat"><b>48</b><span>粉丝</span></div>
        <div class="stat"><b>1.2k</b><span>获赞</span></div>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button data-v="published" class="on">我的发布 <span class="cnt">386</span></button>
      <button data-v="drafts">我的草稿 <span class="cnt">3</span></button>
      <button data-v="folders">收藏夹 <span class="cnt">6</span></button>
    </div>

    <div class="body" id="body"></div>
    <button class="logout" onclick="askLogout()">退出登录<span class="tag-keep">保留</span></button>

    <!-- 编辑资料 -->
    <div class="mask" id="mProfile">
      <div class="dialog">
        <h3>编辑资料</h3>
        <div class="fld">
          <label>头像<span class="tag-keep">保留</span></label>
          <div class="avatars" id="avatarPick"></div>
        </div>
        <div class="fld">
          <label>昵称<span class="tag-keep">保留 · 含随机骰子</span></label>
          <div style="display:flex;gap:8px">
            <input id="nickInput" value="甜蜜小鹿">
            <button class="dice" onclick="rollNick()" title="随机昵称">🎲</button>
          </div>
        </div>
        <div class="fld">
          <label>城市<span class="tag-keep">保留 · 含自动定位</span></label>
          <input id="cityInput" value="杭州">
          <div style="margin-top:6px;font-size:12px;color:#0f766e;cursor:pointer" onclick="detectCity()">📍 检测到「杭州」，点击使用</div>
        </div>
        <div class="dlg-ops">
          <button class="ghost" onclick="close_('mProfile')">取消</button>
          <button class="main" onclick="saveProfile()">保存</button>
        </div>
      </div>
    </div>

    <!-- 修改密码 -->
    <div class="mask" id="mPwd">
      <div class="dialog">
        <h3>修改密码</h3>
        <div class="fld"><label>原密码</label><input type="password" placeholder="请输入原密码"></div>
        <div class="fld"><label>新密码</label><input type="password" placeholder="6-20 位"></div>
        <div class="fld"><label>确认新密码</label><input type="password" placeholder="再次输入"></div>
        <div class="dlg-ops">
          <button class="ghost" onclick="close_('mPwd')">取消</button>
          <button class="main" onclick="close_('mPwd');toast('密码修改成功')">确认修改</button>
        </div>
      </div>
    </div>

    <!-- 通用确认 -->
    <div class="mask" id="mConfirm">
      <div class="dialog">
        <h3 id="cfTitle">提示</h3>
        <div style="font-size:13px;color:#5b6b68;line-height:1.7" id="cfText"></div>
        <div class="dlg-ops">
          <button class="ghost" onclick="close_('mConfirm')">取消</button>
          <button class="main" id="cfOk">确定</button>
        </div>
      </div>
    </div>

    <div class="mask" id="mToast"><div class="dialog" style="max-width:240px;text-align:center;font-size:13.5px" id="toastText"></div></div>
  </div>

  <div class="tip">
    角标说明：<span class="tag-keep">保留</span>原功能不变 ·
    <span class="tag-chg">调整</span>功能保留、交互或样式有变 ·
    <span class="tag-new">新增</span>这次新加。<br>
    可点：三个 tab、点文件夹进入/返回、编辑资料（选头像/骰子随机昵称/定位城市）、修改密码、退出登录。
  </div>
</div>

<script>
const ITEM_H=84, PAGE=20
const TITLES=['小户型收纳清单：有这几样就够了','一人食快手菜｜我的真实体验','秋日露营复盘：做对了什么，也踩过哪些坑','通勤穿搭的6个实用思路','手机摄影入门：从零开始的完整记录','情绪管理的7个实用思路']
const TAGS=['家居','美食','旅行','摄影','穿搭','手作']
const it=i=>({title:TITLES[i%6],tag:TAGS[i%6],time:`${(i%12)+1}月${(i%27)+1}日`,view:30+(i*37)%3000,hue:(i*37)%360})
const DRAFTS=[{t:'周末露营装备清单（还没写完）',d:'9月20日'},{t:'小户型灯光布置的一些想法',d:'9月18日'},{t:'通勤穿搭草稿',d:'9月15日'}]
const FOLDERS=[{id:1,ic:'🏠',n:'家居灵感',c:28},{id:2,ic:'🍜',n:'美食收藏',c:42},{id:3,ic:'🏕',n:'旅行清单',c:16},{id:4,ic:'📷',n:'摄影参考',c:35},{id:5,ic:'👗',n:'穿搭灵感',c:21},{id:6,ic:'📂',n:'未分类',c:9}]
const FOLLOWING=[{ic:'🐰',n:'温暖小兔',a:'user001'},{ic:'🧁',n:'清爽奶茶',a:'user002'},{ic:'📷',n:'文艺胶片',a:'user003'},{ic:'🌙',n:'晚安月亮',a:'moonlight'},{ic:'🍀',n:'三叶草',a:'clover3'}]

const body=document.getElementById('body'), profile=document.getElementById('profile'), tabs=document.getElementById('tabs'), ttl=document.getElementById('ttl')
let state={v:'published',folder:null}

function mountList(root,{total,initial}){
  let loaded=initial
  root.innerHTML=`<div class="virt"><div class="spacer"></div></div><div class="foot"></div>`
  const v=root.querySelector('.virt'), sp=root.querySelector('.spacer'), ft=root.querySelector('.foot')
  function draw(){
    const top=v.scrollTop,h=v.clientHeight
    const s=Math.max(0,Math.floor(top/ITEM_H)-4), e=Math.min(loaded,Math.ceil((top+h)/ITEM_H)+4)
    let html=''
    for(let i=s;i<e;i++){const x=it(i)
      html+=`<div class="card" style="top:${i*ITEM_H}px" onclick="toast('打开灵感：${x.title}')">
        <div class="thumb" style="background:linear-gradient(135deg,hsl(${x.hue} 45% 90%),hsl(${(x.hue+40)%360} 45% 80%))"></div>
        <div class="txt"><div class="t">${x.title}</div>
        <div class="m"><span class="tag">${x.tag}</span><span>·</span><span>${x.time}</span><span>·</span><span>👁 ${x.view}</span></div></div></div>`}
    sp.innerHTML=html; sp.style.height=loaded*ITEM_H+'px'
    const pct=Math.round(loaded/total*100)
    ft.innerHTML = loaded>=total
      ? `<div class="loading">— 已经到底啦，共 ${total} 条 —</div>`
      : `<div class="loading">滚到底自动加载… 已显示 ${loaded} / ${total} 条<span class="tag-chg">调整</span></div><div class="bar"><i style="width:${pct}%"></i></div>`
  }
  v.onscroll=()=>{draw(); if(loaded<total && v.scrollTop+v.clientHeight>=v.scrollHeight-200){loaded=Math.min(loaded+PAGE,total);draw()}}
  draw()
  return ()=>v.scrollTop
}

function render(){
  const keep = body.querySelector('.virt') ? body.querySelector('.virt').scrollTop : 0
  const inSub = state.v==='folder' || state.v==='following'
  profile.style.display = inSub?'none':''
  tabs.style.display = inSub?'none':''
  ttl.textContent = state.v==='folder' ? state.folder.n : (state.v==='following' ? '我的关注' : '个人中心')
  if(state.v==='published') mountList(body,{total:386,initial:PAGE})
  else if(state.v==='drafts'){
    body.innerHTML=`<div style="margin-bottom:8px;font-size:12px;color:#9aa3b2">点草稿继续编辑<span class="tag-keep">保留</span></div>`
      + DRAFTS.map(d=>`<div class="draft" onclick="toast('进入编辑：${d.t}')"><div class="dt">${d.t}</div><div class="dm">${d.d} 保存</div></div>`).join('')
  }
  else if(state.v==='folders'){
    body.innerHTML=`<div style="margin-bottom:8px;font-size:12px;color:#9aa3b2">点文件夹查看其中灵感<span class="tag-keep">保留</span></div>
      <div class="fgrid">${FOLDERS.map(f=>`<div class="folder" onclick="openFolder(${f.id})">
        <div class="ico">${f.ic}</div><div><div class="fn">${f.n}</div><div class="fc">${f.c} 条灵感</div></div></div>`).join('')}
        <div class="folder add" onclick="toast('跳转「我的收藏夹」独立页面')">＋ 管理收藏夹<span class="tag-keep">保留</span></div></div>`
  }
  else if(state.v==='folder'){
    body.innerHTML=`<div class="back-row"><button class="back" onclick="backFolders()">‹ 返回收藏夹</button>
      <span style="font-size:14px;font-weight:700">${state.folder.ic} ${state.folder.n}</span></div><div id="fl"></div>`
    mountList(document.getElementById('fl'),{total:state.folder.c,initial:PAGE})
  }
  else if(state.v==='following'){
    body.innerHTML=`<div class="back-row">
        <button class="back" onclick="backHome()">‹ 返回个人中心</button>
        <span style="font-size:14px;font-weight:700">我的关注</span>
        <span style="font-size:11.5px;color:#9aa3b2">${FOLLOWING.length} 人</span>
        <span class="tag-new">新增</span>
      </div>`
      + FOLLOWING.map((u,i)=>`<div class="urow">
          <div class="uav">${u.ic}</div>
          <div><div class="un">${u.n}</div><div class="ua">@${u.a}</div></div>
          <div class="uops">
            <button onclick="toast('打开与「${u.n}」的私信')">私信<span class="tag-keep">保留</span></button>
            <button class="unfollow" onclick="unfollow(${i})">取消关注</button>
          </div></div>`).join('')
      || `<div class="empty">还没有关注的人</div>`
  }
  const v=body.querySelector('.virt'); if(v&&keep) v.scrollTop=keep
}
function openFolder(id){state.folder=FOLDERS.find(f=>f.id===id);state.v='folder';render()}
function backFolders(){state.v='folders';state.folder=null;render()}
function openFollowing(){state.v='following';render()}
function backHome(){state.v='published';render()}
function unfollow(i){const u=FOLLOWING.splice(i,1)[0];render();toast('已取消关注「'+(u&&u.n)+'」')}
tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  tabs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')
  state.v=b.dataset.v;render()
})

/* 弹窗 */
const AV=['🐰','🧁','📷','🌙','🍀','🐳','🎈','🍓','🐼','🌻','🍋','🦊','🐧','🌈','⭐️','🍃','🐳','🧸','🌵','🍒','🐣','🎧','📚','☕️','🍜','🏕','👗','🎬','✍️','🏃','🪴','🧩']
let picked='🐰'
document.getElementById('avatarPick').innerHTML=AV.map(a=>`<span data-a="${a}" class="${a===picked?'sel':''}" onclick="pickAvatar('${a}')">${a}</span>`).join('')
function pickAvatar(a){picked=a;document.querySelectorAll('#avatarPick span').forEach(s=>s.classList.toggle('sel',s.dataset.a===a))}
function rollNick(){const N=['温柔小鹿','清爽奶盖','文艺胶片','静谧海盐','甜栗子','慢半拍','拾光者','小满日记'];document.getElementById('nickInput').value=N[Math.floor(Math.random()*N.length)]}
function detectCity(){document.getElementById('cityInput').value='杭州'}
function openProfile(){open_('mProfile')}
function openPwd(){open_('mPwd')}
function saveProfile(){document.getElementById('avatarBox').textContent=picked;document.getElementById('nickBox').textContent=document.getElementById('nickInput').value;close_('mProfile');toast('资料已保存')}
function askLogout(){confirm_('退出登录','退出后需要重新登录，确定吗？',()=>{close_('mConfirm');toast('已退出登录')})}
function open_(id){document.getElementById(id).classList.add('on')}
function close_(id){document.getElementById(id).classList.remove('on')}
function confirm_(t,x,cb){document.getElementById('cfTitle').textContent=t;document.getElementById('cfText').textContent=x
  document.getElementById('cfOk').onclick=cb;open_('mConfirm')}
let toastTimer
function toast(msg){const m=document.getElementById('mToast');document.getElementById('toastText').textContent=msg
  m.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>m.classList.remove('on'),1200)}
render()
</script>
</body>
</html>
