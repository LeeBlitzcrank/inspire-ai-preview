<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人页 · 可点击预览（含收藏夹）</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:22px 14px 70px; background:#eef4f2; color:#1d1d1f;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:460px; margin:0 auto; }
  .phone { background:#fff; border-radius:22px; overflow:hidden; box-shadow:0 8px 30px rgba(20,70,60,.10); }

  .topbar { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; border-bottom:1px solid #eef4f2; }
  .topbar .ttl { font-size:15px; font-weight:700; }
  .icon-btn { width:32px; height:32px; border-radius:50%; border:none; background:#f2f8f6; color:#0f766e; font-size:15px; cursor:pointer; }

  .profile { padding:18px 16px 14px; background:linear-gradient(180deg,#f4fbf9,#fff); }
  .p-top { display:flex; align-items:center; gap:12px; }
  .avatar { width:60px; height:60px; border-radius:50%; flex:0 0 auto; background:#e6f2e4; color:#4f8a48;
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
  .p-name { font-size:16.5px; font-weight:700; margin-bottom:4px; }
  .p-acct { font-size:12.5px; color:#8a94a6; }
  .edit { margin-left:auto; padding:7px 14px; border-radius:999px; border:1px solid #cfe6e0; background:#fff; color:#0f766e; font-size:12.5px; cursor:pointer; }
  .stats { display:flex; margin-top:16px; }
  .stat { flex:1; text-align:center; }
  .stat b { display:block; font-size:16px; color:#0f766e; }
  .stat span { font-size:11.5px; color:#9aa3b2; }

  .tabs { display:flex; gap:6px; margin:0 16px 12px; padding:4px; background:#e9f5f2; border-radius:12px; }
  .tabs button { flex:1; padding:9px 0; border:none; border-radius:9px; background:transparent;
    font-family:inherit; font-size:13px; color:#5f807a; cursor:pointer; transition:.15s; }
  .tabs button.on { background:#fff; color:#0f766e; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .tabs .cnt { font-size:11px; color:#9bb5b0; }
  .tabs button.on .cnt { color:#0f766e; }

  .list-area { padding:0 16px 16px; min-height:430px; }

  /* 列表（虚拟） */
  .virt { height:388px; overflow-y:auto; padding-right:2px; }
  .virt-spacer { position:relative; }
  .card { position:absolute; left:0; right:0; height:76px; padding:11px 12px; margin-bottom:8px;
    background:#fff; border:1px solid #e6f2ef; border-radius:14px; cursor:pointer; transition:.16s;
    display:flex; align-items:center; gap:11px; }
  .card:hover { border-color:#a8dcd2; box-shadow:0 4px 14px rgba(30,90,80,.08); }
  .thumb { width:54px; height:54px; border-radius:11px; flex:0 0 auto; }
  .txt { min-width:0; }
  .t { font-size:13.5px; font-weight:600; line-height:1.4; margin-bottom:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .m { display:flex; align-items:center; gap:6px; font-size:11.5px; color:#9aa3b2; }
  .tag { padding:1px 7px; border-radius:999px; background:#f1f7f5; color:#4b7a72; font-size:11px; }

  /* 底部：加载状态 */
  .loading { text-align:center; padding:12px 0; font-size:12px; color:#9aa3b2; }
  .load-more { width:100%; height:36px; border:1px dashed #cfe0dc; background:#fafdfc;
    border-radius:10px; font-family:inherit; font-size:12.5px; color:#0f766e; cursor:pointer; }
  .load-more:hover { background:#f2faf8; border-color:#a8dcd2; }
  .bar { height:4px; border-radius:99px; background:#eef4f2; overflow:hidden; margin-top:9px; }
  .bar i { display:block; height:100%; background:#0f766e; transition:width .2s; }

  /* 草稿 */
  .draft { padding:12px 13px; margin-bottom:9px; background:#fff; border:1px solid #e6f2ef; border-radius:14px; cursor:pointer; }
  .draft .dt { font-size:13.5px; font-weight:600; margin-bottom:6px; }
  .draft .dm { font-size:11.5px; color:#9aa3b2; display:flex; gap:8px; }
  .draft .ops { margin-left:auto; display:flex; gap:8px; }
  .draft .op { font-size:11.5px; color:#0f766e; border:none; background:none; cursor:pointer; }
  .draft .op.del { color:#d9825b; }

  /* 收藏夹网格 */
  .folder-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:11px; }
  .folder { padding:15px 13px; background:#fff; border:1px solid #e6f2ef; border-radius:15px;
    cursor:pointer; transition:.16s; display:flex; align-items:center; gap:11px; }
  .folder:hover { border-color:#a8dcd2; box-shadow:0 4px 14px rgba(30,90,80,.08); transform:translateY(-1px); }
  .folder .ico { width:40px; height:40px; border-radius:12px; background:#f1f7f5; display:flex;
    align-items:center; justify-content:center; font-size:19px; flex:0 0 auto; }
  .folder .fn { font-size:13.5px; font-weight:600; margin-bottom:3px; }
  .folder .fc { font-size:11.5px; color:#9aa3b2; }
  .folder.add { border-style:dashed; justify-content:center; color:#0f766e; font-size:13px; }
  .back-row { display:flex; align-items:center; gap:8px; margin-bottom:11px; }
  .back-btn { border:none; background:none; color:#0f766e; font-size:13px; cursor:pointer; padding:0; }
  .back-name { font-size:14px; font-weight:700; }
  .empty { text-align:center; padding:60px 0; color:#b6c2c0; font-size:13px; }

  /* 切换器 */
  .switcher { margin-top:16px; padding:12px 14px; background:#fff; border:1px solid #e6f2ef; border-radius:14px; }
  .switcher .lb { font-size:12.5px; color:#6b7280; margin-bottom:9px; }
  .chip { padding:5px 12px; border:1px solid #e3ecea; border-radius:999px; background:#fff;
    font-size:12px; color:#5b6b68; cursor:pointer; }
  .chip.on { background:#0f766e; border-color:#0f766e; color:#fff; }
  .note { margin-top:14px; font-size:12px; color:#8a94a6; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="topbar">
      <button class="icon-btn" id="topBack">‹</button>
      <div class="ttl" id="topTitle">个人中心</div>
      <button class="icon-btn">⚙</button>
    </div>

    <div class="profile" id="profile">
      <div class="p-top">
        <div class="avatar">甜</div>
        <div>
          <div class="p-name">甜蜜小鹿</div>
          <div class="p-acct">@admin</div>
        </div>
        <button class="edit">编辑资料</button>
      </div>
      <div class="stats">
        <div class="stat"><b>386</b><span>灵感</span></div>
        <div class="stat"><b>12</b><span>关注</span></div>
        <div class="stat"><b>48</b><span>粉丝</span></div>
        <div class="stat"><b>1.2k</b><span>获赞</span></div>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button data-v="published" class="on">我的发布 <span class="cnt">386</span></button>
      <button data-v="drafts">我的草稿 <span class="cnt">3</span></button>
      <button data-v="folders">收藏夹 <span class="cnt">6</span></button>
    </div>

    <div class="list-area" id="body"></div>
  </div>

  <div class="switcher">
    <div class="lb">列表加载方式（虚拟列表配套的两种）：</div>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="chip on" id="modeAuto">① 滚到底自动加载</span>
      <span class="chip" id="modeBtn">② 手动点「加载更多」</span>
    </div>
    <div class="note" id="modeNote"></div>
  </div>
</div>

<script>
/* ============ 数据 ============ */
const TITLES = ['小户型收纳清单：有这几样就够了','一人食快手菜｜我的真实体验','秋日露营复盘：做对了什么，也踩过哪些坑','通勤穿搭的6个实用思路','手机摄影入门：从零开始的完整记录','情绪管理的7个实用思路']
const TAGS = ['家居','美食','旅行','摄影','穿搭','手作']
const item = (i) => ({
  title: TITLES[i % TITLES.length],
  tag: TAGS[i % TAGS.length],
  time: `${(i % 12) + 1}月${(i % 27) + 1}日`,
  view: 30 + ((i * 37) % 3000),
  hue: (i * 37) % 360
})
const PUBLISHED_TOTAL = 386
const DRAFTS = [
  { title: '周末露营装备清单（还没写完）', time: '9月20日' },
  { title: '小户型灯光布置的一些想法', time: '9月18日' },
  { title: '通勤穿搭草稿', time: '9月15日' }
]
const FOLDERS = [
  { id:1, icon:'🏠', name:'家居灵感', count:28 },
  { id:2, icon:'🍜', name:'美食收藏', count:42 },
  { id:3, icon:'🏕', name:'旅行清单', count:16 },
  { id:4, icon:'📷', name:'摄影参考', count:35 },
  { id:5, icon:'👗', name:'穿搭灵感', count:21 },
  { id:6, icon:'📂', name:'未分类', count:9 }
]

/* ============ 虚拟列表（可复用） ============ */
const ITEM_H = 84, OVERSCAN = 4, PAGE_SIZE = 20
let mode = 'auto'          // auto | btn
let state = { view:'published', folder:null }

/**
 * 渲染一个「虚拟列表 + 分批加载」区块
 * total：总条数；loaded：已加载条数（数据分批追加的模型）
 */
function mountList(root, { total, loaded, onNeedMore, showBtn }) {
  root.innerHTML = `
    <div class="virt"><div class="virt-spacer"></div></div>
    <div class="foot"></div>`
  const virt = root.querySelector('.virt')
  const spacer = root.querySelector('.virt-spacer')
  const foot = root.querySelector('.foot')

  function draw() {
    const top = virt.scrollTop, h = virt.clientHeight
    const start = Math.max(0, Math.floor(top / ITEM_H) - OVERSCAN)
    const end = Math.min(loaded, Math.ceil((top + h) / ITEM_H) + OVERSCAN)
    let html = ''
    for (let i = start; i < end; i++) {
      const it = item(i)
      html += `<div class="card" style="top:${i * ITEM_H}px">
        <div class="thumb" style="background:linear-gradient(135deg,hsl(${it.hue} 45% 90%),hsl(${(it.hue+40)%360} 45% 80%))"></div>
        <div class="txt"><div class="t">${it.title}</div>
          <div class="m"><span class="tag">${it.tag}</span><span>·</span><span>${it.time}</span><span>·</span><span>👁 ${it.view}</span></div>
        </div></div>`
    }
    spacer.innerHTML = html
    spacer.style.height = loaded * ITEM_H + 'px'
    const pct = Math.round(loaded / total * 100)
    if (loaded >= total) {
      foot.innerHTML = `<div class="loading">— 已经到底啦，共 ${total} 条 —</div>`
    } else if (showBtn) {
      foot.innerHTML = `<button class="load-more">↓ 加载更多（已显示 ${loaded} / ${total} 条）</button>
        <div class="bar"><i style="width:${pct}%"></i></div>`
      foot.querySelector('.load-more').onclick = onNeedMore
    } else {
      foot.innerHTML = `<div class="loading">正在加载… 已显示 ${loaded} / ${total} 条</div>
        <div class="bar"><i style="width:${pct}%"></i></div>`
    }
  }

  virt.onscroll = () => {
    draw()
    // 无限滚动：离底部还有 200px 就补下一页
    if (!showBtn && loaded < total &&
        virt.scrollTop + virt.clientHeight >= virt.scrollHeight - 200) {
      onNeedMore()
    }
  }
  draw()
  // 首次不够一屏时也补一次
  if (!showBtn && loaded < total && virt.scrollHeight <= virt.clientHeight + 10) onNeedMore()
}

/* ============ 各视图 ============ */
const body = document.getElementById('body')
const profile = document.getElementById('profile')
const tabs = document.getElementById('tabs')
const topTitle = document.getElementById('topTitle')
let pubLoaded = 0, folderLoaded = 0

function render() {
  const inFolder = state.view === 'folder'
  // 重渲染前记住滚动位置：加载更多 / 切换加载方式时不能把用户弹回顶部
  const keepScroll = body.querySelector('.virt') ? body.querySelector('.virt').scrollTop : 0
  // 子页面（收藏夹详情）隐藏个人信息与 tab
  profile.style.display = inFolder ? 'none' : ''
  tabs.style.display = inFolder ? 'none' : ''
  topTitle.textContent = inFolder ? (state.folder.name) : '个人中心'

  if (state.view === 'published') {
    if (!pubLoaded) pubLoaded = PAGE_SIZE
    mountList(body, {
      total: PUBLISHED_TOTAL,
      loaded: pubLoaded,
      showBtn: mode === 'btn',
      onNeedMore: () => {
        const next = Math.min(pubLoaded + PAGE_SIZE, PUBLISHED_TOTAL)
        if (next !== pubLoaded) { pubLoaded = next; render() }
      }
    })
  } else if (state.view === 'drafts') {
    body.innerHTML = DRAFTS.map(d => `
      <div class="draft" onclick="alert('打开草稿编辑：${d.title}')">
        <div class="dt">${d.title}</div>
        <div class="dm"><span>${d.time} 保存</span>
          <span class="ops"><button class="op">继续编辑</button><button class="op del">删除</button></span>
        </div>
      </div>`).join('')
  } else if (state.view === 'folders') {
    body.innerHTML = `<div class="folder-grid">${
      FOLDERS.map(f => `
        <div class="folder" onclick="openFolder(${f.id})">
          <div class="ico">${f.icon}</div>
          <div><div class="fn">${f.name}</div><div class="fc">${f.count} 条灵感</div></div>
        </div>`).join('')
    }<div class="folder add" onclick="alert('新建收藏夹')">＋ 新建收藏夹</div></div>`
  } else if (state.view === 'folder') {
    if (!folderLoaded) folderLoaded = PAGE_SIZE
    body.innerHTML = `
      <div class="back-row">
        <button class="back-btn" onclick="backToFolders()">‹ 返回收藏夹</button>
        <span class="back-name">${state.folder.icon} ${state.folder.name}</span>
      </div>
      <div id="folderList"></div>`
    mountList(document.getElementById('folderList'), {
      total: state.folder.count,
      loaded: folderLoaded,
      showBtn: mode === 'btn',
      onNeedMore: () => {
        const next = Math.min(folderLoaded + PAGE_SIZE, state.folder.count)
        if (next !== folderLoaded) { folderLoaded = next; render() }
      }
    })
  }
  // 还原滚动位置（赋值会触发 scroll 事件，列表会按新位置重画）
  const v = body.querySelector('.virt')
  if (v && keepScroll) v.scrollTop = keepScroll
}

/* ============ 交互 ============ */
function openFolder(id) {
  state.folder = FOLDERS.find(f => f.id === id)
  state.view = 'folder'
  folderLoaded = 0
  render()
}
function backToFolders() {
  state.view = 'folders'
  state.folder = null
  render()
}
document.getElementById('topBack').onclick = () => {
  if (state.view === 'folder') backToFolders()
  else alert('返回上一页')
}
tabs.querySelectorAll('button').forEach(btn => {
  btn.onclick = () => {
    tabs.querySelectorAll('button').forEach(b => b.classList.remove('on'))
    btn.classList.add('on')
    state.view = btn.dataset.v
    render()
  }
})
document.getElementById('modeAuto').onclick = () => setMode('auto')
document.getElementById('modeBtn').onclick = () => setMode('btn')
function setMode(m) {
  mode = m
  document.getElementById('modeAuto').classList.toggle('on', m === 'auto')
  document.getElementById('modeBtn').classList.toggle('on', m === 'btn')
  document.getElementById('modeNote').innerHTML = m === 'auto'
    ? '滚到接近底部自动补下一页，用户不用点任何按钮 —— <b>推荐</b>，和虚拟列表最搭。'
    : '底部显示「加载更多」按钮，用户点一次补一页。数据量不确定时更可控。'
  render()
}
setMode('auto')
</script>
</body>
</html>
