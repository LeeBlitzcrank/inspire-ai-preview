<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>当前首页 + 底部工具栏预览</title>
<style>
  *{box-sizing:border-box}
  :root{
    --ink:#1d1d1f;
    --muted:#8f959b;
    --line:#e5ebf2;
    --paper:#fbfcfe;
    --card:#fff;
    --blue:#409eff;
    --blue-soft:#f4f7fd;
    --green:#1f6d5c;
  }
  html,body{min-height:100%}
  body{
    margin:0;color:var(--ink);background:#e9efec;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  button{font:inherit;cursor:pointer}
  .page{min-height:100dvh;padding:28px 26px 48px;display:flex;align-items:flex-start;justify-content:center;gap:50px}
  .intro{width:min(390px,31vw);padding-top:24px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--green);font-size:11px;font-weight:900;letter-spacing:.1em}
  .eyebrow:before{content:"";width:23px;height:2px;background:currentColor;border-radius:2px}
  .intro h1{margin:12px 0 0;font-size:34px;line-height:1.12}
  .intro>p{margin:14px 0 0;color:#62736e;font-size:13px;line-height:1.85}
  .notes{display:grid;gap:8px;margin-top:22px}
  .note{padding:12px 13px;border:1px solid rgba(31,109,92,.14);border-radius:14px;background:rgba(255,255,255,.66)}
  .note b{display:block;font-size:12px}
  .note span{display:block;margin-top:4px;color:#74847f;font-size:10.5px;line-height:1.55}
  .summary{margin-top:20px;padding:14px;border-radius:16px;background:#173a32;color:#fff}
  .summary small{color:#9ed8c9;font-size:9.5px;font-weight:850;letter-spacing:.07em}
  .summary b{display:block;margin-top:8px;font-size:15px;line-height:1.5}
  .summary span{display:block;margin-top:6px;color:rgba(255,255,255,.65);font-size:10.5px;line-height:1.6}
  .compare-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
  .compare-tabs button{height:38px;border:1px solid #d6e5e0;border-radius:12px;background:#fff;color:#60736d;font-size:11px;font-weight:850}
  .compare-tabs button.on{border-color:#7fb6a8;background:#edf7f4;color:#1f6d5c}
  .phone-slot{position:relative;flex:0 0 auto}
  .phone{
    position:absolute;left:0;top:0;width:412px;height:866px;padding:11px;border-radius:47px;
    background:#0c1518;box-shadow:0 34px 80px rgba(14,50,42,.24),inset 0 0 0 1px rgba(255,255,255,.08);
    transform-origin:top left;
  }
  .phone:before{content:"";position:absolute;z-index:9;left:50%;top:9px;width:112px;height:26px;border-radius:999px;background:#0c1518;transform:translateX(-50%)}
  .screen{position:absolute;inset:11px;overflow:hidden;border-radius:37px;background:#fff}
  .statusbar{position:absolute;z-index:30;inset:0 0 auto;height:31px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;color:#19352e;font-size:10.5px;font-weight:850}
  .status-right{display:flex;gap:5px;font-size:9px}
  .app{position:absolute;inset:31px 0 0;overflow:hidden;background:var(--paper)}
  .app-scroll{height:100%;overflow-y:auto;scrollbar-width:none;padding-bottom:100px}
  .app-scroll::-webkit-scrollbar{display:none}
  .home{width:100%;padding:10px 16px 80px;background:#fbfcfe;min-height:100%}
  .top-nav{display:flex;align-items:center;justify-content:space-between;padding:5px 0 20px}
  .nav-logo,.nav-icon{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.05);font-size:19px}
  .nav-logo{width:40px;height:40px;font-size:25px}
  .nav-icons{display:flex;gap:12px}
  .nav-icon{position:relative}
  .home.top-simple .full-only{display:none}
  .noti-badge{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#f56c6c;color:#fff;font-size:9px;line-height:16px;font-weight:700}
  .tab-bar{display:flex;gap:8px;margin-bottom:20px;padding:4px;border-radius:12px;background:#f4f7fd}
  .tab-item{flex:1;padding:8px 4px;border:0;border-radius:10px;background:transparent;color:#666;font-size:13px;text-align:center;transition:.22s}
  .tab-item.active{background:#fff;color:var(--blue);font-weight:650;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .swipe-section{padding:4px 0 40px}
  .swipe-heading{text-align:center;margin-bottom:26px}
  .swipe-heading h1{margin:0;font-size:27px;background:linear-gradient(90deg,#409eff,#a855f7);-webkit-background-clip:text;color:transparent}
  .swipe-heading p{margin:8px 0 0;color:#999;font-size:12.5px}
  .swipe-container{position:relative;width:100%;max-width:360px;height:460px;margin:0 auto}
  .card{position:absolute;inset:0;overflow:hidden;border-radius:20px;background:#b45a97;box-shadow:0 4px 20px rgba(0,0,0,.12)}
  .card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,20,27,.01) 35%,rgba(9,20,27,.72))}
  .card-pattern{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 22px,transparent 22px 45px)}
  .card-texts{position:absolute;z-index:2;left:0;bottom:0;width:100%;padding:30px 20px;display:flex;flex-direction:column;justify-content:flex-end}
  .card-word{margin-bottom:5px;color:#fff;font-size:27px;font-weight:650;line-height:1.3}
  .card-tag{display:inline-block;width:fit-content;margin-bottom:8px;padding:4px 14px;border-radius:99px;background:#28c76f;color:#fff;font-size:12.5px}
  .swipe-buttons{display:flex;justify-content:center;gap:30px;margin-top:40px}
  .swipe-buttons button{width:60px;height:60px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.1);font-size:24px}
  .btn-left{color:#ff4d4f}
  .btn-right{color:#52c41a}
  .bottom-dock{
    position:absolute;z-index:40;left:14px;right:14px;bottom:12px;height:64px;padding:7px 9px;
    display:grid;grid-template-columns:repeat(5,1fr);gap:2px;border:1px solid rgba(216,228,238,.96);
    border-radius:21px;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);
    box-shadow:0 12px 28px rgba(26,70,60,.14);
  }
  .bottom-dock button{min-width:0;border:0;border-radius:15px;background:transparent;color:#929ba5;font-size:9px;font-weight:800}
  .bottom-dock svg{display:block;width:19px;height:19px;margin:0 auto 3px}
  .bottom-dock button.active{background:#edf6f3;color:var(--green)}
  .bottom-dock button.compose{position:relative}
  .bottom-dock button.compose:after{content:"";position:absolute;inset:5px 10px;border-radius:15px;background:var(--green);z-index:-1}
  .bottom-dock button.compose svg,.bottom-dock button.compose{color:#fff}
  @media (max-width:980px){
    .page{display:block;padding:18px 0 34px}
    .intro{width:min(412px,calc(100vw - 24px));margin:0 auto 18px;padding-top:0}
    .notes,.summary{display:none}
    .intro h1{font-size:28px}
    .intro>p{font-size:12px}
    .phone-slot{margin:0 auto}
  }
</style>
</head>
<body>
<main class="page">
  <section class="intro">
    <div class="eyebrow">CURRENT HOME + TOOLBAR</div>
    <h1>当前首页增加底部工具栏</h1>
    <p>顶部导航、推荐卡片、分类标签以及原有配色全部保持不变，只在手机底部增加一层固定工具栏。</p>
    <div class="notes">
      <div class="note"><b>现有内容不动</b><span>推荐卡片和分类切换仍按原来的位置和样式展示。</span></div>
      <div class="note"><b>高频入口下沉</b><span>底部提供首页、搜索、发布、世界和我的，方便单手触达。</span></div>
      <div class="note"><b>顶部继续保留</b><span>这一版不移除现有顶部入口，方便直接比较是否重复。</span></div>
    </div>
    <div class="summary">
      <small>本次只验证这一版</small>
      <b>推荐精简顶部 + 固定底部工具栏</b>
      <span>顶部只保留 Logo、AI 探索和通知，其余入口统一放到底部。</span>
    </div>
    <div class="compare-tabs">
      <button type="button" data-top="full">完整顶部</button>
      <button class="on" type="button" data-top="simple">推荐精简</button>
    </div>
  </section>

  <div class="phone-slot" id="phoneSlot">
    <div class="phone" id="phone">
      <div class="screen">
        <div class="statusbar"><span id="clock">09:41</span><div class="status-right"><span>5G</span><span>●●●</span><span>100%</span></div></div>
        <div class="app">
          <div class="app-scroll">
            <div class="home top-simple" id="homeView">
              <nav class="top-nav">
                <button class="nav-logo" type="button">🍎</button>
                <div class="nav-icons">
                  <button class="nav-icon full-only" type="button">✨</button>
                  <button class="nav-icon full-only" type="button">🔍</button>
                  <button class="nav-icon full-only" type="button">📖</button>
                  <button class="nav-icon" type="button">🧠</button>
                  <button class="nav-icon" type="button">🔔<span class="noti-badge">3</span></button>
                  <button class="nav-icon full-only" type="button">👤</button>
                </div>
              </nav>

              <div class="tab-bar">
                <button class="tab-item active" type="button">👇 推荐卡片</button>
                <button class="tab-item" type="button">📋 灵感分类</button>
              </div>

              <section class="swipe-section">
                <div class="swipe-heading">
                  <h1>灵感推荐</h1>
                  <p>拖动卡片左右滑动，左滑跳过，右滑收藏</p>
                </div>
                <div class="swipe-container">
                  <article class="card">
                    <div class="card-pattern"></div>
                    <div class="card-texts">
                      <span class="card-tag">运动</span>
                      <div class="card-word">居家训练｜我的真实体验</div>
                    </div>
                  </article>
                </div>
                <div class="swipe-buttons">
                  <button class="btn-left" type="button">✕</button>
                  <button class="btn-right" type="button">♥</button>
                </div>
              </section>
            </div>
          </div>

          <nav class="bottom-dock">
            <button class="active" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
              首页
            </button>
            <button type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              搜索
            </button>
            <button class="compose" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              发布
            </button>
            <button type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
              世界
            </button>
            <button type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              我的
            </button>
          </nav>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const slot=document.getElementById('phoneSlot')
const phone=document.getElementById('phone')
const homeView=document.getElementById('homeView')
const topTabs=[...document.querySelectorAll('[data-top]')]

function switchTop(mode){
  homeView.classList.toggle('top-simple',mode==='simple')
  topTabs.forEach(tab=>tab.classList.toggle('on',tab.dataset.top===mode))
}

topTabs.forEach(tab=>tab.addEventListener('click',()=>switchTop(tab.dataset.top)))

function fitPhone(){
  const scale=Math.min(1,(window.innerWidth-24)/412,(window.innerHeight-40)/866)
  phone.style.transform=`scale(${scale})`
  slot.style.width=`${412*scale}px`
  slot.style.height=`${866*scale}px`
}

function tickClock(){
  const now=new Date()
  document.getElementById('clock').textContent=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`
}

fitPhone()
tickClock()
const initialTop=new URLSearchParams(window.location.search).get('top')
switchTop(initialTop==='full'?'full':'simple')
window.addEventListener('resize',fitPhone)
setInterval(tickClock,30000)
</script>
</body>
</html>
