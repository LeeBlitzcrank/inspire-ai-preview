<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>灵感模板预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef3f2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d2b28}
    .wrap{width:min(960px,94vw);margin:28px auto}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.head h1{margin:0;font-size:26px}.head p{margin:6px 0 0;color:#74837f}
    .templates{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.template{border:1px solid #dfece9;background:#fff;border-radius:16px;padding:15px;cursor:pointer;text-align:left;transition:.18s}.template:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(34,82,73,.1)}.template.active{border-color:#0f766e;background:#f0faf7}.template .icon{width:38px;height:38px;border-radius:12px;background:#e6f5f1;display:grid;place-items:center;font-size:19px}.template b{display:block;margin-top:13px;font-size:15px}.template p{margin:6px 0 0;color:#82908c;font-size:12px;line-height:1.6}
    .editor{margin-top:20px;display:grid;grid-template-columns:1fr 1.35fr;gap:18px}.panel{background:#fff;border:1px solid #dfece9;border-radius:18px;padding:18px}.panel h2{margin:0 0 12px;font-size:16px}.fields{display:flex;flex-direction:column;gap:11px}.field label{display:block;color:#6f7e7a;font-size:11px;margin-bottom:5px}.field div{min-height:38px;border:1px solid #e0e9e7;border-radius:10px;padding:9px 11px;font-size:13px;color:#53625e;background:#fbfdfc}.body-field{min-height:190px;white-space:pre-wrap;line-height:1.75}.tip{margin-top:12px;border-radius:11px;padding:10px 12px;background:#f3faf8;color:#527a73;font-size:11.5px;line-height:1.6}
    @media(max-width:720px){.templates{grid-template-columns:1fr 1fr}.editor{grid-template-columns:1fr}.wrap{margin:18px auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head"><div><h1>灵感模板</h1><p>选择结构后，编辑器自动填充可替换的引导内容。</p></div><span style="font-size:12px;color:#87948f">点击卡片切换</span></header>
    <section class="templates" id="templates"></section>
    <section class="editor">
      <div class="panel"><h2>模板结构</h2><div class="fields" id="fields"></div><div class="tip">模板只提供结构和提示，最终内容仍由用户修改后发布。</div></div>
      <div class="panel"><h2>编辑效果预览</h2><div class="fields" id="preview"></div></div>
    </section>
  </main>
  <script>
    const templates=[
      {id:'探店',icon:'📍',name:'探店',desc:'地点、体验、推荐与避坑',fields:['店名 / 地点：','整体感受：','必点 / 必看：','价格与性价比：','适合人群与避坑：'],body:'一、环境与第一印象\n\n二、实际体验\n\n三、推荐清单\n\n四、价格与建议'},
      {id:'测评',icon:'🔍',name:'测评',desc:'对象、标准、过程、结论',fields:['测评对象：','使用场景：','对比维度：','优点：','缺点与结论：'],body:'一、为什么测它\n\n二、测评标准\n\n三、真实使用过程\n\n四、优点与不足\n\n五、最终结论'},
      {id:'教程',icon:'🧭',name:'教程',desc:'目标、材料、步骤与注意事项',fields:['要解决的问题：','准备材料：','预计耗时：','适合新手程度：','最后效果：'],body:'一、开始前准备\n\n二、详细步骤\n1. \n2. \n3. \n\n三、容易出错的地方\n\n四、完成后的效果'},
      {id:'清单',icon:'☑️',name:'清单',desc:'场景、物品、优先级与补充',fields:['使用场景：','必备清单：','可选清单：','不建议带：','补充说明：'],body:'一、这份清单适合谁\n\n二、必须先准备\n\n三、按需增加\n\n四、不建议携带\n\n五、最后提醒'}
    ];let active=0;
    function render(){document.getElementById('templates').innerHTML=templates.map((t,i)=>`<button class="template ${i===active?'active':''}" onclick="choose(${i})"><span class="icon">${t.icon}</span><b>${t.name}</b><p>${t.desc}</p></button>`).join('');const t=templates[active];document.getElementById('fields').innerHTML=t.fields.map(x=>`<div class="field"><label>字段提示</label><div>${x}</div></div>`).join('');document.getElementById('preview').innerHTML=`<div class="field"><label>标题</label><div>${t.name}｜我的真实体验</div></div><div class="field"><label>正文</label><div class="body-field">${t.body}</div></div>`}
    function choose(i){active=i;render()}render()
  </script>
</body>
</html>
