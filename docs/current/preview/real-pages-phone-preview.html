<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>真实页面 · 等比缩放手机框</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #e9eef4;
  }
  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
  }

  .phone {
    --screen-w: 390px;
    --screen-h: 844px;
    --status-h: 32px;
    width: calc(var(--screen-w) + 22px);
    height: calc(var(--screen-h) + 22px);
    padding: 11px;
    border-radius: 46px;
    background: #10161d;
    box-shadow:
      0 30px 70px rgba(25, 42, 64, .24),
      inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .phone[data-device="se"] {
    --screen-w: 375px;
    --screen-h: 667px;
    border-radius: 38px;
    --status-h: 28px;
  }
  .phone[data-device="max"] {
    --screen-w: 430px;
    --screen-h: 932px;
    border-radius: 50px;
    --status-h: 34px;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 35px;
    background: #f3f6fa;
  }
  .phone[data-device="se"] .screen { border-radius: 28px; }
  .phone[data-device="max"] .screen { border-radius: 39px; }

  .statusbar {
    position: absolute;
    z-index: 2;
    top: 0;
    left: 0;
    right: 0;
    height: var(--status-h);
    padding: 0 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    color: #121820;
    font-size: 11px;
    font-weight: 800;
    line-height: 1;
  }
  .phone[data-device="se"] .statusbar { padding: 0 13px; font-size: 10px; }
  .phone[data-device="max"] .statusbar { padding: 0 20px; font-size: 12px; }
  .status-time { letter-spacing: .01em; }
  .status-icons { display: flex; align-items: center; gap: 5px; }
  .status-icons svg { display: block; width: auto; height: 11px; }
  .signal-5g { font-size: 9px; font-weight: 850; letter-spacing: 0; }

  .viewport {
    position: absolute;
    top: var(--status-h);
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
    background: #f3f6fa;
  }

  /*
   * 逻辑画布永远是 390 × 844。
   * iframe 在这个固定尺寸里完成一次布局，外层只做 transform: scale()。
   * 因此 SE / 标准 / Max 里的页面结构完全一致，不会触发响应式重排。
   */
  .canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 390px;
    height: 844px;
    transform-origin: top left;
    background: #fff;
  }
  iframe {
    width: 390px;
    height: 844px;
    display: block;
    border: 0;
    background: #fff;
  }

  @media (max-width: 460px) {
    body { padding: 0; background: #10161d; }
    .phone,
    .phone[data-device="se"],
    .phone[data-device="max"] {
      width: 100%;
      height: 100dvh;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .screen,
    .phone[data-device="se"] .screen,
    .phone[data-device="max"] .screen { border-radius: 0; }
    .statusbar,
    .phone[data-device="se"] .statusbar,
    .phone[data-device="max"] .statusbar { padding-top: env(safe-area-inset-top); height: calc(var(--status-h) + env(safe-area-inset-top)); }
  }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="screen" id="screen">
      <div class="statusbar">
        <span class="status-time">9:41</span>
        <div class="status-icons">
          <svg viewBox="0 0 20 12" aria-hidden="true">
            <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
            <rect x="4.5" y="6" width="3" height="6" rx="1" fill="currentColor"/>
            <rect x="9" y="3.5" width="3" height="8.5" rx="1" fill="currentColor"/>
            <rect x="13.5" y="0.5" width="3" height="11.5" rx="1" fill="currentColor"/>
          </svg>
          <span class="signal-5g">5G</span>
          <svg viewBox="0 0 18 13" aria-hidden="true">
            <path d="M1 4.2C5.5 0 12.5 0 17 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M4 7.2c2.8-2.5 7.2-2.5 10 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M7 10c1.2-1 2.8-1 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="9" cy="12" r="1.1" fill="currentColor"/>
          </svg>
          <svg viewBox="0 0 26 12" aria-hidden="true">
            <rect x="0.8" y="0.8" width="21" height="10.4" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
            <rect x="2.6" y="2.6" width="16.2" height="6.8" rx="1.8" fill="currentColor"/>
            <path d="M23.5 4v4c1.1-.3 1.8-1 1.8-2s-.7-1.7-1.8-2z" fill="currentColor" opacity=".55"/>
          </svg>
        </div>
      </div>
      <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
          <iframe
            src="http://127.0.0.1:5173/#/"
            title="真实页面预览"
            allow="clipboard-read; clipboard-write; fullscreen; camera; microphone"
          ></iframe>
        </div>
      </div>
    </div>
  </div>

<script>
  const LOGICAL_WIDTH = 390;
  const LOGICAL_HEIGHT = 844;
  const params = new URLSearchParams(location.search);
  const device = ['se', 'standard', 'max'].includes(params.get('device'))
    ? params.get('device')
    : 'standard';

  const phone = document.getElementById('phone');
  const viewport = document.getElementById('viewport');
  const canvas = document.getElementById('canvas');

  phone.dataset.device = device;

  function fitCanvas() {
    const width = viewport.clientWidth;
    const height = viewport.clientHeight;
    const scale = Math.min(width / LOGICAL_WIDTH, height / LOGICAL_HEIGHT);
    const scaledWidth = LOGICAL_WIDTH * scale;
    const scaledHeight = LOGICAL_HEIGHT * scale;
    const left = (width - scaledWidth) / 2;
    const top = (height - scaledHeight) / 2;
    canvas.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
  }

  fitCanvas();
  window.addEventListener('resize', fitCanvas);
</script>
</body>
</html>
