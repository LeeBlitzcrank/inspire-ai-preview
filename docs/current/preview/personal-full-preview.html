<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人页 · 整页预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:22px 14px 70px; background:#eef4f2; color:#1d1d1f;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 460px; margin:0 auto; }

  /* 页面外壳，模拟手机里的这一页 */
  .phone { background:#fff; border-radius:22px; overflow:hidden; box-shadow:0 8px 30px rgba(20,70,60,.10); }
  .topbar { height:52px; display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; border-bottom:1px solid #eef4f2; }
  .topbar .ttl { font-size:15px; font-weight:700; }
  .icon-btn { width:32px; height:32px; border-radius:50%; border:none; background:#f2f8f6;
    color:#0f766e; font-size:15px; cursor:pointer; }

  /* 个人信息区 */
  .profile { padding:18px 16px 14px; background:linear-gradient(180deg,#f4fbf9,#fff); }
  .p-top { display:flex; align-items:center; gap:12px; }
  .avatar { width:60px; height:60px; border-radius:50%; flex:0 0 auto;
    background:#e6f2e4; color:#4f8a48; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; }
  .p-name { font-size:16.5px; font-weight:700; margin-bottom:4px; }
  .p-acct { font-size:12.5px; color:#8a94a6; }
  .edit { margin-left:auto; padding:7px 14px; border-radius:999px; border:1px solid #cfe6e0;
    background:#fff; color:#0f766e; font-size:12.5px; cursor:pointer; }
  .stats { display:flex; margin-top:16px; }
  .stat { flex:1; text-align:center; }
  .stat b { display:block; font-size:16px; color:#0f766e; }
  .stat span { font-size:11.5px; color:#9aa3b2; }

  /* Tab */
  .tabs { display:flex; gap:6px; margin:0 16px 12px; padding:4px; background:#e9f5f2; border-radius:12px; }
  .tabs button { flex:1; padding:9px 0; border:none; border-radius:9px; background:transparent;
    font-family:inherit; font-size:13px; color:#5f807a; cursor:pointer; transition:.15s; }
  .tabs button.on { background:#fff; color:#0f766e; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .tabs .cnt { font-size:11px; color:#9bb5b0; }
  .tabs button.on .cnt { color:#0f766e; }

  /* 列表（虚拟列表：只渲染可视区） */
  .list-area { padding:0 16px 16px; }
  .virt { height:380px; overflow-y:auto; padding-right:2px; }
  .virt-spacer { position:relative; }
  .card { position:absolute; left:0; right:0; height:76px; padding:11px 12px; margin-bottom:8px;
    background:#fff; border:1px solid #e6f2ef; border-radius:14px; cursor:pointer; transition:.16s;
    display:flex; align-items:center; gap:11px; }
  .card:hover { border-color:#a8dcd2; box-shadow:0 4px 14px rgba(30,90,80,.08); }
  .thumb { width:54px; height:54px; border-radius:11px; flex:0 0 auto;
    background:linear-gradient(135deg,#dff0e8,#cfe7dd); }
  .txt { min-width:0; }
  .t { font-size:13.5px; font-weight:600; line-height:1.4; margin-bottom:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .m { display:flex; align-items:center; gap:6px; font-size:11.5px; color:#9aa3b2; }
  .tag { padding:1px 7px; border-radius:999px; background:#f1f7f5; color:#4b7a72; font-size:11px; }

  /* 底部分页：4 种方案可切换 */
  .pager-box { margin-top:12px; padding-top:12px; border-top:1px dashed #e3ecea; }
  .pg-btn { min-width:29px; height:29px; padding:0 8px; border:1px solid #e3ecea; background:#fff;
    border-radius:8px; font-family:inherit; font-size:12.5px; color:#5b6b68; cursor:pointer; }
  .pg-btn:hover { border-color:#a8dcd2; color:#0f766e; }
  .pg-btn.on { background:#0f766e; border-color:#0f766e; color:#fff; font-weight:700; }
  .pg-btn.dots { border:none; background:transparent; cursor:default; color:#b6c2c0; }
  .row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .spacer { flex:1; }
  .tiny { font-size:11.5px; color:#9aa3b2; }
  .load-more { width:100%; height:36px; border:1px dashed #cfe0dc; background:#fafdfc;
    border-radius:10px; font-family:inherit; font-size:12.5px; color:#0f766e; cursor:pointer; }
  .bar { height:4px; border-radius:99px; background:#eef4f2; overflow:hidden; margin-top:9px; }
  .bar i { display:block; height:100%; background:#0f766e; }
  .chip { padding:5px 12px; border:1px solid #e3ecea; border-radius:999px; background:#fff;
    font-size:12px; color:#5b6b68; cursor:pointer; }
  .chip.on { background:#0f766e; border-color:#0f766e; color:#fff; }
  .slim { display:flex; align-items:center; gap:10px; }
  .slim .nav { width:31px; height:31px; border-radius:50%; border:1px solid #e3ecea;
    background:#fff; cursor:pointer; color:#5b6b68; font-size:14px; }
  .slim .cur { font-size:12.5px; color:#374151; }
  .slim .cur b { color:#0f766e; }

  /* 方案切换器 */
  .switcher { margin-top:16px; padding:12px 14px; background:#fff; border:1px solid #e6f2ef; border-radius:14px; }
  .switcher .lb { font-size:12.5px; color:#6b7280; margin-bottom:9px; }
  .switcher .row .chip span { color:#9aa3b2; font-size:11px; margin-left:4px; }
  .switcher .row .chip.on span { color:#cdece5; }
  .note { margin-top:14px; font-size:12px; color:#8a94a6; line-height:1.75; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="topbar">
      <button class="icon-btn">‹</button>
      <div class="ttl">个人中心</div>
      <button class="icon-btn">⚙</button>
    </div>

    <div class="profile">
      <div class="p-top">
        <div class="avatar">甜</div>
        <div>
          <div class="p-name">甜蜜小鹿</div>
          <div class="p-acct">@admin</div>
        </div>
        <button class="edit">编辑资料</button>
      </div>
      <div class="stats">
        <div class="stat"><b>386</b><span>灵感</span></div>
        <div class="stat"><b>12</b><span>关注</span></div>
        <div class="stat"><b>48</b><span>粉丝</span></div>
        <div class="stat"><b>1.2k</b><span>获赞</span></div>
      </div>
    </div>

    <div class="tabs">
      <button class="on">我的发布 <span class="cnt">386</span></button>
      <button>我的草稿 <span class="cnt">3</span></button>
      <button>收藏夹 <span class="cnt">6</span></button>
    </div>

    <div class="list-area">
      <div class="virt" id="virt">
        <div class="virt-spacer" id="spacer"></div>
      </div>

      <div class="pager-box">
        <div id="pager"></div>
      </div>
    </div>
  </div>

  <div class="switcher">
    <div class="lb">切换底部分页方案（上面列表会跟着变）：</div>
    <div class="row" id="switchRow">
      <span class="chip on" data-p="B">B 加载更多 <span>推荐</span></span>
      <span class="chip" data-p="A">A 紧凑页码</span>
      <span class="chip" data-p="D">D 极简 ‹ 9/40 ›</span>
      <span class="chip" data-p="C">C 区间分段</span>
    </div>
    <div class="note">
      上面列表用的是虚拟列表：无论多少条，DOM 只保留可视区那 8 张卡片。<br>
      个人页推荐 <b>B</b>：往下滚的场景，加载更多比翻页自然，也和虚拟列表天然搭。
    </div>
  </div>
</div>

<script>
  const TOTAL = 386
  const ITEM_H = 84                 // 卡片 76 + 间距 8
  const TITLES = ['小户型收纳清单：有这几样就够了','一人食快手菜｜我的真实体验','秋日露营复盘：做对了什么，也踩过哪些坑','通勤穿搭的6个实用思路','手机摄影入门：从零开始的完整记录','情绪管理的7个实用思路']
  const TAGS = ['家居','美食','旅行','摄影','穿搭','手作']
  const items = Array.from({ length: TOTAL }, (_, i) => ({
    title: TITLES[i % TITLES.length],
    tag: TAGS[i % TAGS.length],
    time: `${(i % 12) + 1}月${(i % 27) + 1}日`,
    view: 30 + ((i * 37) % 3000)
  }))

  /* ---- 虚拟列表 ---- */
  const virt = document.getElementById('virt')
  const spacer = document.getElementById('spacer')
  const OVERSCAN = 4
  spacer.style.height = TOTAL * ITEM_H + 'px'

  function renderVirt() {
    const top = virt.scrollTop
    const h = virt.clientHeight
    const start = Math.max(0, Math.floor(top / ITEM_H) - OVERSCAN)
    const end = Math.min(TOTAL, Math.ceil((top + h) / ITEM_H) + OVERSCAN)
    let html = ''
    for (let i = start; i < end; i++) {
      const it = items[i]
      html += `<div class="card" style="top:${i * ITEM_H}px">
        <div class="thumb" style="background:linear-gradient(135deg,hsl(${(i*37)%360} 45% 90%),hsl(${((i*37)+40)%360} 45% 80%))"></div>
        <div class="txt">
          <div class="t">${it.title}</div>
          <div class="m"><span class="tag">${it.tag}</span><span>·</span><span>${it.time}</span><span>·</span><span>👁 ${it.view}</span></div>
        </div>
      </div>`
    }
    spacer.innerHTML = html
  }
  virt.addEventListener('scroll', renderVirt, { passive: true })
  renderVirt()

  /* ---- 底部分页：4 种方案 ---- */
  const pager = document.getElementById('pager')
  const PAGES = Math.ceil(TOTAL / 10)
  const CUR = 9
  function renderPager(kind) {
    if (kind === 'A') {
      pager.innerHTML = `<div class="row">
        <div class="row">
          <button class="pg-btn">首页</button><button class="pg-btn">‹</button>
          <button class="pg-btn">1</button><button class="pg-btn dots">…</button>
          <button class="pg-btn">8</button><button class="pg-btn on">9</button><button class="pg-btn">10</button>
          <button class="pg-btn dots">…</button><button class="pg-btn">${PAGES}</button>
          <button class="pg-btn">›</button><button class="pg-btn">末页</button>
        </div><div class="spacer"></div><span class="tiny">共 ${PAGES} 页 · ${TOTAL} 条</span>
      </div>`
    } else if (kind === 'B') {
      pager.innerHTML = `<button class="load-more">↓ 加载更多（已显示 90 / ${TOTAL} 条）</button>
        <div class="bar"><i style="width:23%"></i></div>`
    } else if (kind === 'C') {
      pager.innerHTML = `<div class="row">
        <span class="chip on">1 - 10 页</span><span class="chip">11 - 20 页</span>
        <span class="chip">21 - 30 页</span><span class="chip">31 - ${PAGES} 页</span>
        <div class="spacer"></div><span class="tiny">当前第 ${CUR} 页</span></div>`
    } else {
      pager.innerHTML = `<div class="row">
        <div class="slim"><button class="nav">‹</button>
          <span class="cur">第 <b>${CUR}</b> / ${PAGES} 页</span>
          <button class="nav">›</button></div>
        <div class="spacer"></div><span class="tiny">每页 10 条 · 共 ${TOTAL} 条</span></div>
        <div class="bar"><i style="width:${Math.round(CUR / PAGES * 100)}%"></i></div>`
    }
  }
  document.querySelectorAll('#switchRow .chip').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('#switchRow .chip').forEach(x => x.classList.remove('on'))
      el.classList.add('on')
      renderPager(el.dataset.p)
    }
  })
  renderPager('B')
</script>
</body>
</html>
