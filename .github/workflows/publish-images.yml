# 文件：.github/workflows/publish-images.yml
# 所属模块：GitHub Actions 自动化流程
# 主要职责：YAML 配置，定义服务、运行参数或自动化流程
# 维护说明：注释解释文件边界和核心意图，具体业务规则以方法、组件和主文档说明为准。
# INSPIRE_FILE_HEADER
name: Publish Backend Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - inspire-auth
          - inspire-ai
          - inspire-core
          - inspire-admin
          - inspire-search
          - inspire-gateway
          - inspire-rag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build module
        working-directory: backend
        run: mvn package -DskipTests -pl "${{ matrix.service }}" -am

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${GITHUB_REF_NAME:-manual}"
          echo "IMAGE=ghcr.io/${owner}/${{ matrix.service }}:${tag}" >> "$GITHUB_ENV"

      - name: Build and push
        run: |
          docker build \
            -f deploy/docker/Dockerfile.local \
            --build-arg "BUILD_MODULE=${{ matrix.service }}" \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"
