# ==================== 共享配置 ====================
x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inspire_ai_preview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${INSPIRE_DB_PASSWORD:?INSPIRE_DB_PASSWORD is required}
  INSPIRE_DB_PASSWORD: ${INSPIRE_DB_PASSWORD:?INSPIRE_DB_PASSWORD is required}
  INSPIRE_AUTH_DB_PASSWORD: ${INSPIRE_AUTH_DB_PASSWORD:?INSPIRE_AUTH_DB_PASSWORD is required}
  INSPIRE_ADMIN_DB_PASSWORD: ${INSPIRE_ADMIN_DB_PASSWORD:?INSPIRE_ADMIN_DB_PASSWORD is required}
  INSPIRE_GATEWAY_DB_PASSWORD: ${INSPIRE_GATEWAY_DB_PASSWORD:?INSPIRE_GATEWAY_DB_PASSWORD is required}
  INSPIRE_SEARCH_DB_PASSWORD: ${INSPIRE_SEARCH_DB_PASSWORD:?INSPIRE_SEARCH_DB_PASSWORD is required}
  INSPIRE_JWT_SECRET: ${INSPIRE_JWT_SECRET:?INSPIRE_JWT_SECRET is required}
  INSPIRE_INTERNAL_AUTH_SECRET: ${INSPIRE_INTERNAL_AUTH_SECRET:?INSPIRE_INTERNAL_AUTH_SECRET is required}
  INSPIRE_MAIL_USERNAME: ${INSPIRE_MAIL_USERNAME:-}
  INSPIRE_MAIL_PASSWORD: ${INSPIRE_MAIL_PASSWORD:-}
  # 文档5.1节：Docker环境变量注入JWT_SECRET，与INSPIRE_JWT_SECRET保持一致
  JWT_SECRET: ${INSPIRE_JWT_SECRET:?INSPIRE_JWT_SECRET is required}
  # AccessToken有效期15分钟（文档4.1.2节）
  INSPIRE_JWT_ACCESS_EXPIRATION: 900000
  INSPIRE_REDIS_PASSWORD: ${INSPIRE_REDIS_PASSWORD:?INSPIRE_REDIS_PASSWORD is required}
  INSPIRE_ES_HOSTS: elasticsearch:9200
  # 日志文件路径（每个容器的 /logs 挂载到不同的宿主机目录）
  LOGGING_FILE_NAME: /logs/app.log
  LOGGING_PATTERN_LEVEL: "%5p [traceId=%X{traceId:-}]"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
  SPRING_CACHE_REDIS_ENABLE_STATISTICS: "true"
  ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
  INSPIRE_REDIS_HOST: redis
  INSPIRE_REDIS_PORT: 6379
  SPRING_REDIS_HOST: redis
  SPRING_REDIS_PORT: 6379
  SPRING_REDIS_PASSWORD: ${INSPIRE_REDIS_PASSWORD:?INSPIRE_REDIS_PASSWORD is required}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${INSPIRE_REDIS_PASSWORD:?INSPIRE_REDIS_PASSWORD is required}
  # MinIO：容器内必须用 service 名访问，默认值 localhost:9000 在容器里连不通
  INSPIRE_MINIO_ENDPOINT: http://minio:9000
  INSPIRE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  INSPIRE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  INSPIRE_MINIO_BUCKET: inspire-img
  # 邮件重置密码链接的前端域名（生产改为 https://ai.20sherry.com）
  INSPIRE_APP_FRONTEND_URL: https://ai.20sherry.com
  # 网关 CORS 来源白名单（逗号分隔），必须与前端访问域名一致
  INSPIRE_CORS_ALLOWED_ORIGINS: ${INSPIRE_CORS_ALLOWED_ORIGINS:-https://ai.20sherry.com,http://localhost:5173,http://127.0.0.1:5173}
  INSPIRE_SESSION_LONG_LIVED_USERS: ${INSPIRE_SESSION_LONG_LIVED_USERS:-}
  # 日志时间
  TZ: Asia/Shanghai

x-service-build: &service-build
  context: .
  dockerfile: docker/Dockerfile.local

# ==================== 服务定义 ====================
services:
  # -------- 基础设施 --------
  mysql:
    image: mysql:8.0
    container_name: inspire-mysql
    ports: [ "127.0.0.1:3307:3306" ]
    environment:
      MYSQL_ROOT_PASSWORD: ${INSPIRE_DB_PASSWORD:?INSPIRE_DB_PASSWORD is required}
      MYSQL_DATABASE: inspire_ai_preview
      # 容器时区固定为北京时间，避免 CURRENT_TIMESTAMP 写入 UTC 导致前后端时间差 8 小时
      TZ: Asia/Shanghai
    command:
      - "--default-time-zone=+08:00"
      - "--slow-query-log=1"
      - "--long-query-time=0.5"
      - "--slow-query-log-file=/var/log/mysql/slow.log"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./log/mysql:/var/log/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: elasticsearch:7.17.22
    container_name: inspire-es
    ports: [ "127.0.0.1:9200:9200", "127.0.0.1:9300:9300" ]
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./log/elasticsearch:/usr/share/elasticsearch/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: inspire-mq-namesrv
    ports: [ "127.0.0.1:9876:9876" ]
    command: sh mqnamesrv
    environment: { JAVA_OPT_EXT: -Xms512m -Xmx512m }
    volumes:
      - ./log/rocketmq:/home/rocketmq/logs/rocketmqlogs
    healthcheck:
      test: [ "CMD-SHELL", "ss -tln | grep -q ':9876' || ps aux | grep -v grep | grep -q namesrv" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: inspire-mq-broker
    ports: [ "127.0.0.1:10911:10911", "127.0.0.1:10909:10909" ]
    depends_on:
      rocketmq-namesrv: { condition: service_healthy }
    command: sh mqbroker -n ${ROCKETMQ_NAMESRV_ADDR:-rocketmq-namesrv:9876}
    environment:
        JAVA_OPT_EXT: -Xms1g -Xmx1g -XX:+UseG1GC
    volumes:
      - ./log/rocketmq:/home/rocketmq/logs/rocketmqlogs
    healthcheck:
      test: [ "CMD-SHELL", "ss -tln | grep -q ':10911' || ps aux | grep -v grep | grep -q broker" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${INSPIRE_REDIS_PASSWORD:?INSPIRE_REDIS_PASSWORD is required}
    environment:
      INSPIRE_REDIS_PASSWORD: ${INSPIRE_REDIS_PASSWORD:?INSPIRE_REDIS_PASSWORD is required}
    container_name: inspire-redis
    ports: [ "127.0.0.1:6379:6379" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${INSPIRE_REDIS_PASSWORD}\" ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # -------- 后端服务 --------
  inspire-auth:
    build:
      <<: *service-build
      args:
        BUILD_MODULE: inspire-auth
    container_name: inspire-auth
    ports: [ "127.0.0.1:8081:8081" ]
    depends_on:
      mysql: { condition: service_healthy }
      rocketmq-broker: { condition: service_healthy }
    environment: *common-env
    volumes: [ ./log/inspire-auth:/logs ]

  inspire-ai:
    build:
      <<: *service-build
      args:
        BUILD_MODULE: inspire-ai
    container_name: inspire-ai
    ports: [ "127.0.0.1:8082:8082" ]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rocketmq-broker: { condition: service_healthy }
    environment:
      <<: *common-env
      INSPIRE_DEEPSEEK_API_KEY: ${INSPIRE_DEEPSEEK_API_KEY:-}
      INSPIRE_UNSPLASH_ACCESS_KEY: ${INSPIRE_UNSPLASH_ACCESS_KEY:-}
      SPRING_APPLICATION_JSON: '{"redis":{"host":"redis","port":6379}}'
    volumes: [ ./log/inspire-ai:/logs ]

  inspire-core:
    build:
      <<: *service-build
      args:
        BUILD_MODULE: inspire-core
    container_name: inspire-core
    ports: [ "127.0.0.1:8083:8083" ]
    depends_on:
      mysql: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      rocketmq-broker: { condition: service_healthy }
    environment:
      <<: *common-env
      INSPIRE_UNSPLASH_ACCESS_KEY: ${INSPIRE_UNSPLASH_ACCESS_KEY:-}
      # 演示数据生成开关（幂等：目标用户已有数据会自动跳过）
      # 需要灌数据时：INSPIRE_DEMO_SEED=true docker compose up -d --force-recreate inspire-core
      INSPIRE_DEMO_SEED: ${INSPIRE_DEMO_SEED:-false}
      # small=默认演示数据，large=万级压测数据
      INSPIRE_DEMO_SCALE: ${INSPIRE_DEMO_SCALE:-small}
      INSPIRE_IMAGE_BACKFILL_VARIANTS: ${INSPIRE_IMAGE_BACKFILL_VARIANTS:-false}
    volumes:
      - ./log/inspire-core:/logs
      # 上传文件放在项目目录内，避免 macOS 定期清理 /tmp 导致图片/视频丢失
      - ./data/uploads:/tmp/inspire-uploads

  inspire-admin:
    build:
      <<: *service-build
      args:
        BUILD_MODULE: inspire-admin
    container_name: inspire-admin
    ports: [ "127.0.0.1:8085:8085" ]
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      <<: *common-env
      INSPIRE_ADMIN_JWT_SECRET: ${INSPIRE_ADMIN_JWT_SECRET:?INSPIRE_ADMIN_JWT_SECRET is required}
    volumes: [ ./log/inspire-admin:/logs ]

  inspire-search:
    build:
      <<: *service-build
      args:
        BUILD_MODULE: inspire-search
    container_name: inspire-search
    ports: [ "127.0.0.1:8086:8086" ]
    depends_on:
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *common-env
    volumes: [ ./log/inspire-search:/logs ]

  inspire-gateway:
    build:
      <<: *service-build
      args:
        BUILD_MODULE: inspire-gateway
    container_name: inspire-gateway
    ports: [ "127.0.0.1:8080:8080" ]
    depends_on:
      inspire-auth: { condition: service_started }
      inspire-ai: { condition: service_started }
      inspire-core: { condition: service_started }
      inspire-admin: { condition: service_started }
      inspire-search: { condition: service_started }
    environment:
      <<: *common-env
      INSPIRE_GATEWAY_RATE_LIMIT_REPLENISH: ${INSPIRE_GATEWAY_RATE_LIMIT_REPLENISH:-50}
      INSPIRE_GATEWAY_RATE_LIMIT_BURST: ${INSPIRE_GATEWAY_RATE_LIMIT_BURST:-100}
      INSPIRE_AUTH_RATE_LIMIT_REPLENISH: ${INSPIRE_AUTH_RATE_LIMIT_REPLENISH:-50}
      INSPIRE_AUTH_RATE_LIMIT_BURST: ${INSPIRE_AUTH_RATE_LIMIT_BURST:-100}
      INSPIRE_CORE_WRITE_RATE_LIMIT_REPLENISH: ${INSPIRE_CORE_WRITE_RATE_LIMIT_REPLENISH:-50}
      INSPIRE_CORE_WRITE_RATE_LIMIT_BURST: ${INSPIRE_CORE_WRITE_RATE_LIMIT_BURST:-100}
      INSPIRE_AI_RATE_LIMIT_REPLENISH: ${INSPIRE_AI_RATE_LIMIT_REPLENISH:-5}
      INSPIRE_AI_RATE_LIMIT_BURST: ${INSPIRE_AI_RATE_LIMIT_BURST:-10}
      routes_auth_service: http://inspire-auth:8081
      routes_ai_service: http://inspire-ai:8082
      routes_core_service: http://inspire-core:8083
      routes_admin_service: http://inspire-admin:8085
      routes_search_service: http://inspire-search:8086
    volumes: [ ./log/inspire-gateway:/logs ]

  # -------- MinIO 对象存储 + Nginx 图片缓存 --------
  minio:
    image: quay.io/minio/minio:latest
    container_name: inspire-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nginx-image:
    container_name: inspire-nginx-image
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./docker/minio/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/minio/nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx/images
    depends_on:
      minio: { condition: service_started }
    restart: unless-stopped

volumes:
  mysql-data:
  es-data:
  minio-data:
  nginx-cache:
