# =============================================
# Nginx 图片代理缓存配置（文档第4章）
# 本地 Mac 演示环境，监听 8088 端口
# 生产以 Cloudflare Tunnel 代理 80 端口
# =============================================
proxy_cache_path /var/cache/nginx/images
                 levels=1:2
                 keys_zone=imgcache:50m
                 max_size=50g
                 inactive=30d
                 use_temp_path=off;

server {
    listen 80;
    server_name localhost img.20sherry.com;
    charset utf-8;

    # ===== 安全头 =====
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # ===== 防盗链（文档 4.1 节双层防盗链） =====
    # Nginx 本地校验 Referer，合法域名白名单
    # Cloudflare WAF 已在云端兜底拦截
    valid_referers none blocked
        ~\.20sherry\.com$
        ~\.github\.io$
        ~^http://localhost:5173$
        ~^http://localhost:808[0-9]$
        server_names;
    if ($invalid_referer) {
        return 403;
    }

    # ===== 私有图片目录：Nginx 直接拦截（文档 3.3 节） =====
    # 禁止直连私有目录，仅允许后端签名 URL 访问
    location ~ ^/upload/private/(.*)$ {
        # 允许签名 URL 访问：带 X-Signature-Allowed 头的请求放行
        # 后端生成签名 URL 时附带此头（通过 MinIO 预签名 URL 实现）
        # 无签名的直连请求全部 403
        if ($http_x_signature_allowed != "1") {
            return 403;
        }
        # 正则location proxy_pass 不能带路径，用rewrite拼接
        rewrite ^/upload/private/(.*)$ /inspire-img/private/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ===== 公开图片目录：反向代理 MinIO + 磁盘缓存 =====
    location ~ ^/upload/(.*)$ {
        # 正则location proxy_pass 不能带路径，rewrite拼接桶路径
        rewrite ^/upload/(.*)$ /inspire-img/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors on;

        # ----------------------
        # 文档 4.2 缓存策略
        # ----------------------
        proxy_cache imgcache;
        proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_cache_revalidate on;

        # 图片转换：传参 ?w=宽度 生成缩略图 + WebP
        set $width "";
        if ($arg_w ~ "^(\d+)$") {
            set $width $1;
        }

        add_header X-Cache-Status $upstream_cache_status;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 默认拒绝其他路径 =====
    location / {
        return 403;
    }
}
