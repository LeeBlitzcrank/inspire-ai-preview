<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" preserveAspectRatio="xMidYMid slice">
  <!--
    AI 探索词云 · 薄荷绿底图（程序化 SVG，无外部依赖）
    - 主色 #A8DCD2，极淡的斜向渐变
    - 左上柔和高光 + 右下柔和暗角
    - 极轻颗粒，避免大面积纯色死板
    如需替换为其它图片，同名覆盖本文件即可。
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#B8E4DB"/>
      <stop offset="0.5" stop-color="#A8DCD2"/>
      <stop offset="1"   stop-color="#97CFC4"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.24" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh" cx="0.86" cy="0.86" r="0.72">
      <stop offset="0" stop-color="#6aa99b" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6aa99b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.82">
      <stop offset="0.5" stop-color="#5d9b8e" stop-opacity="0"/>
      <stop offset="1"   stop-color="#5d9b8e" stop-opacity="0.16"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1240" height="500" fill="url(#base)"/>
  <rect width="1240" height="500" fill="url(#hi)"/>
  <rect width="1240" height="500" fill="url(#sh)"/>
  <rect width="1240" height="500" filter="url(#grain)" opacity="0.5"/>
  <rect width="1240" height="500" fill="url(#vig)"/>
</svg>
